<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root { --bg:#111214; --card:#1b1d21; --line:#2a2d33; --text:#f1f1ee; --muted:#9a9b97; --accent:#2a78d6; --good:#1baf7a; --warn:#eda100; --r:16px; }
* { box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body { overflow-x:hidden; margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
body { padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px); max-width:560px; margin:auto; }
h1 { font-size:26px; margin:4px 0 2px; } .muted { color:var(--muted); font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:12px 0; }
.card.done { opacity:.55; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.ex-name { font-weight:650; font-size:17px; } .tag { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.cue { font-size:13px; color:var(--muted); margin:4px 0 10px; }
.sets { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 6px; }
.set { width:52px; height:52px; border-radius:50%; border:2px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; }
.set.on { background:var(--good); border-color:var(--good); color:#08130e; }
.stepper { display:flex; align-items:center; gap:6px; }
.stepper button { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:#24272c; color:var(--text); font-size:20px; }
.stepper input { width:64px; height:40px; text-align:center; border-radius:12px; border:1px solid var(--line); background:#24272c; color:var(--text); font-size:17px; font-weight:650; }
.rpe { display:flex; gap:6px; margin-top:10px; align-items:center; } .rpe span { font-size:13px; color:var(--muted); margin-right:2px; }
.chip { min-width:40px; height:36px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; }
.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.meal .row { align-items:flex-start; } .meal .when { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.meal .buy { font-size:13px; color:var(--muted); margin-top:6px; } .meal .acts { display:flex; gap:8px; margin-top:10px; }
.eat { flex:1; height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; }
.eat.on { background:var(--good); border-color:var(--good); color:#08130e; } .swap { width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:18px; }
.macros { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .mac .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; } .mac .t { font-size:12px; color:var(--muted); }
.mbar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:4px; } .mbar div { height:100%; border-radius:4px; background:var(--accent); } .mbar div.full { background:var(--good); }
.quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .quick .chip { padding:0 10px; font-size:14px; }
.streak { font-size:13px; color:var(--muted); }
.mob label { display:flex; gap:10px; align-items:center; padding:8px 0; font-size:15px; }
.mob input { width:22px; height:22px; accent-color:var(--good); }
.bar { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(transparent, var(--bg) 30%); }
.bar .inner { max-width:560px; margin:auto; display:flex; gap:10px; }
.btn { flex:1; height:54px; border-radius:14px; border:0; font-size:17px; font-weight:650; background:var(--accent); color:#fff; }
.btn.ghost { flex:0 0 54px; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:22px; }
.btn:disabled { opacity:.4; }
.timer { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:8px 16px; border-radius:20px; font-weight:700; font-variant-numeric:tabular-nums; display:none; z-index:5; }
.timer.show { display:block; } .timer.over { background:var(--good); color:#08130e; }
.field { display:block; margin:10px 0; } .field input { width:100%; height:46px; border-radius:12px; border:1px solid var(--line); background:#24272c; color:var(--text); padding:0 12px; font-size:16px; }
.hist { font-size:14px; } .hist .row { padding:6px 0; border-bottom:1px solid var(--line); }
.badge { flex:none; white-space:nowrap; font-size:12px; padding:2px 8px; border-radius:10px; background:#24272c; color:var(--muted); }
.badge.up { background:rgba(27,175,122,.18); color:var(--good); }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#24272c; border:1px solid var(--line); padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:90%; text-align:center; }
.toast.show { display:block; }
nav { display:flex; gap:8px; margin:8px 0 4px; } nav button { flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:14px; }
nav button.on { background:var(--card); color:var(--text); }
svg.spark { width:100%; height:40px; }
</style>
</head>
<body>
<div id="timer" class="timer"></div>
<div id="toast" class="toast"></div>
<header>
  <div class="row"><h1 id="title">Gym</h1><span id="sync" class="badge"></span></div>
  <div id="sub" class="muted"></div>
  <nav><button data-tab="food">Food</button><button data-tab="today" class="on">Gym</button><button data-tab="history">Progress</button><button data-tab="settings">⚙</button></nav>
</header>
<main id="app"></main>
<div class="bar" id="bar"><div class="inner"><button class="btn" id="finish">Finish and upload</button></div></div>

<script>
// ---------- program ----------
const PROGRAM = [
  { id:"tbdl", name:"Trap-bar deadlift", tag:"Max strength", sets:4, reps:5, unit:"kg", step:2.5, inc:5, rest:180, cue:"Brace, push the floor away. Every rep crisp, stop 1-2 reps before failure." },
  { id:"bss", name:"Bulgarian split squat", tag:"Max strength · per leg", sets:3, reps:6, unit:"kg", step:1, inc:2, rest:120, cue:"Total dumbbell weight. Knee tracks over the 2nd toe, hips level." },
  { id:"hpc", name:"Hang power clean", tag:"Explosive", sets:5, reps:3, unit:"kg", step:2.5, inc:2.5, rest:120, cue:"Maximal speed. If the bar slows or form breaks, keep the weight." },
  { id:"splank", name:"Side plank + hip abduction", tag:"Isometric · per side", sets:3, reps:1, unit:"s", step:5, inc:5, max:60, rest:60, cue:"Top leg lifted. Straight line ear-hip-ankle. Weight goes on the hip after 60 s." },
  { id:"calf", name:"Single-leg calf raise, bent knee", tag:"Strength + isometric · per leg", sets:3, reps:8, unit:"kg", step:1, inc:2, rest:60, cue:"Knee bent ~30°. 3 s hold at the top. Weight in the hand." },
];
const MOBILITY = ["Hip 90/90, 1 min", "Ankle to wall, 1 min per side", "Thoracic rotation, 10 per side"];

// ---------- storage ----------
const LS = { get:(k,d)=>{ try { const v = localStorage.getItem("gym."+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set:(k,v)=>localStorage.setItem("gym."+k, JSON.stringify(v)) };
let settings = LS.get("settings", { key:"", athlete:"0" });
let history = LS.get("history", []);          // finished sessions
let queue = LS.get("queue", []);              // sessions waiting for upload
let cur = LS.get("current", null);            // session in progress
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt, parent) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined && txt !== null) n.textContent = txt; if (parent) parent.appendChild(n); return n; };
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2600); };

// Next target per exercise from the last session (double progression on RPE).
function targetFor(ex) {
  const last = [...history].reverse().find((s) => s.ex[ex.id] && s.ex[ex.id].load !== null && s.ex[ex.id].load !== "");
  if (!last) return { load: ex.unit === "s" ? 30 : null, note: ex.unit === "s" ? "Start" : "Test: RPE 6 weight", up:false };
  const r = last.ex[ex.id], all = r.done >= ex.sets, load = Number(r.load);
  if (all && r.rpe && r.rpe <= 7) { const n = ex.max ? Math.min(ex.max, load + ex.inc) : load + ex.inc; return { load:n, note:`+${n - load} ${ex.unit} (last: RPE ${r.rpe})`, up:n > load }; }
  if (!all) return { load, note:`Same: ${r.done}/${ex.sets} sets last time`, up:false };
  return { load, note:`Same (last: RPE ${r.rpe || "?"})`, up:false };
}
function newSession() {
  const ex = {};
  PROGRAM.forEach((p) => { const t = targetFor(p); ex[p.id] = { load: t.load, done:0, rpe:null }; });
  return { id:"gym-" + Date.now(), start:new Date().toISOString(), mob:[], ex };
}
const save = () => LS.set("current", cur);

// ---------- rest timer ----------
let tEnd = 0, tInt = null;
function startRest(sec) {
  tEnd = Date.now() + sec * 1000; clearInterval(tInt);
  const t = $("#timer"); t.classList.add("show"); t.classList.remove("over");
  const tick = () => {
    const left = Math.round((tEnd - Date.now()) / 1000);
    if (left <= 0) { t.textContent = "Go"; t.classList.add("over"); if (left === 0 && navigator.vibrate) navigator.vibrate([200,100,200]); if (left < -20) { clearInterval(tInt); t.classList.remove("show"); } return; }
    t.textContent = `Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  };
  tick(); tInt = setInterval(tick, 1000);
}
$("#timer").addEventListener("click", () => { clearInterval(tInt); $("#timer").classList.remove("show"); });

// ---------- views ----------
let tab = ["food","today","history","settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#sync").textContent = queue.length ? `${queue.length} to upload` : (settings.key ? "Intervals ✓" : "No API key");
  $("#bar").style.display = tab === "today" ? "" : "none";
  const app = $("#app"); app.innerHTML = "";
  if (tab === "today") today(app); else if (tab === "food") food(app); else if (tab === "history") progress(app); else settingsView(app);
}
function today(app) {
  if (!cur) { cur = newSession(); save(); }
  const doneEx = PROGRAM.filter((p) => cur.ex[p.id].done >= p.sets).length;
  $("#title").textContent = "Today";
  $("#sub").textContent = `${doneEx} of ${PROGRAM.length} exercises · ${history.length} sessions logged`;

  const mob = el("div", "card mob" + (cur.mob.length === MOBILITY.length ? " done" : ""), null, app);
  el("div", "tag", "Mobility · 5 min", mob);
  MOBILITY.forEach((m, i) => {
    const l = el("label", null, null, mob); const c = el("input", null, null, l); c.type = "checkbox"; c.checked = cur.mob.includes(i); el("span", null, m, l);
    c.addEventListener("change", () => { cur.mob = c.checked ? [...cur.mob, i] : cur.mob.filter((x) => x !== i); save(); render(); });
  });

  PROGRAM.forEach((p) => {
    const r = cur.ex[p.id], t = targetFor(p);
    const card = el("div", "card" + (r.done >= p.sets && r.rpe ? " done" : ""), null, app);
    el("div", "tag", p.tag, card);
    const top = el("div", "row", null, card);
    el("div", "ex-name", p.name, top);
    el("span", "badge" + (t.up ? " up" : ""), t.note, top);
    el("div", "cue", p.cue, card);
    const row = el("div", "row", null, card);
    el("div", "muted", `${p.sets} × ${p.unit === "s" ? "" : p.reps + " @"}`, row);
    const st = el("div", "stepper", null, row);
    const minus = el("button", null, "−", st), inp = el("input", null, null, st), plus = el("button", null, "+", st);
    inp.inputMode = "decimal"; inp.placeholder = p.unit; inp.value = r.load ?? "";
    el("span", "muted", p.unit, st);
    const setLoad = (v) => { r.load = v === "" || isNaN(v) ? null : Math.max(0, Math.round(v * 10) / 10); save(); inp.value = r.load ?? ""; };
    minus.onclick = () => setLoad((Number(inp.value) || 0) - p.step);
    plus.onclick = () => setLoad((Number(inp.value) || 0) + p.step);
    inp.onchange = () => setLoad(inp.value === "" ? "" : Number(inp.value.replace(",", ".")));
    const sets = el("div", "sets", null, card);
    for (let i = 0; i < p.sets; i++) {
      const b = el("button", "set" + (i < r.done ? " on" : ""), p.unit === "s" ? `${r.load || ""}s` : String(p.reps), sets);
      b.onclick = () => {
        if (r.load === null) { toast("Enter the weight first"); inp.focus(); return; }
        const wasOn = i < r.done; r.done = wasOn ? i : i + 1; save(); render();
        if (!wasOn && r.done < p.sets) startRest(p.rest);
      };
    }
    if (r.done >= p.sets) {
      const rp = el("div", "rpe", null, card); el("span", null, "RPE", rp);
      [6,7,8,9,10].forEach((v) => { const c = el("button", "chip" + (r.rpe === v ? " on" : ""), String(v), rp); c.onclick = () => { r.rpe = v; save(); render(); }; });
    }
  });
  $("#finish").disabled = !PROGRAM.some((p) => cur.ex[p.id].done > 0);
}
function progress(app) {
  $("#title").textContent = "Progress";
  $("#sub").textContent = `${history.length} sessions`;
  if (!history.length) { el("div", "card muted", "Your first session sets the starting weights. Progress shows here after it.", app); return; }
  PROGRAM.forEach((p) => {
    const pts = history.filter((s) => s.ex[p.id] && s.ex[p.id].load).map((s) => ({ d:s.start, v:Number(s.ex[p.id].load), rpe:s.ex[p.id].rpe }));
    const c = el("div", "card", null, app);
    const top = el("div", "row", null, c); el("div", "ex-name", p.name, top);
    el("span", "badge", pts.length ? `${pts[pts.length-1].v} ${p.unit}${pts.length > 1 ? ` · ${pts[pts.length-1].v - pts[0].v >= 0 ? "+" : ""}${Math.round((pts[pts.length-1].v - pts[0].v)*10)/10}` : ""}` : "–", top);
    if (pts.length > 1) {
      const lo = Math.min(...pts.map((x) => x.v)), hi = Math.max(...pts.map((x) => x.v)), W = 300, H = 40;
      const sx = (i) => 4 + (i / (pts.length - 1)) * (W - 8), sy = (v) => hi === lo ? H/2 : H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
      c.insertAdjacentHTML("beforeend", `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${pts.map((x,i)=>`${i?"L":"M"}${sx(i)},${sy(x.v)}`).join(" ")}" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
    }
  });
  const h = el("div", "card hist", null, app); el("div", "tag", "Sessions", h);
  [...history].reverse().slice(0, 12).forEach((s) => {
    const r = el("div", "row", null, h);
    el("span", null, new Date(s.start).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }), r);
    el("span", "badge" + (s.uploaded ? " up" : ""), s.uploaded ? "in Intervals" : "waiting", r);
  });
}
function settingsView(app) {
  $("#title").textContent = "Settings"; $("#sub").textContent = "Stored only on this phone.";
  const c = el("div", "card", null, app);
  const f1 = el("label", "field", null, c); el("div", "muted", "Intervals.icu API key (Settings → Developer)", f1);
  const k = el("input", null, null, f1); k.type = "password"; k.value = settings.key; k.autocomplete = "off";
  const f2 = el("label", "field", null, c); el("div", "muted", "Athlete id (0 = you)", f2);
  const a = el("input", null, null, f2); a.value = settings.athlete;
  const b = el("button", "btn", "Save and test", c); b.style.width = "100%";
  b.onclick = async () => {
    settings = { key:k.value.trim(), athlete:a.value.trim() || "0" }; LS.set("settings", settings);
    try { const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}`, { headers:{ Authorization:auth() } }); toast(r.ok ? "Connected to Intervals.icu" : `Failed (${r.status}). Check the key.`); } catch(e) { toast("No connection. Saved anyway."); }
    flush(); render();
  };
  const d = el("div", "card", null, app); el("div", "tag", "Data", d);
  const ex = el("button", "chip", "Export backup", d); ex.style.marginTop = "8px";
  ex.onclick = () => { const blob = new Blob([JSON.stringify({ history }, null, 1)], { type:"application/json" }); const u = URL.createObjectURL(blob); const l = el("a"); l.href = u; l.download = "gym-backup.json"; l.click(); };
  const rs = el("button", "chip", "Discard today's session", d); rs.style.margin = "8px 0 0 8px";
  rs.onclick = () => { if (confirm("Discard the session in progress?")) { cur = null; LS.set("current", null); tab = "today"; render(); } };
}

// ---------- food: one breakfast, lunch and dinner a day, plus a macro panel ----------
// Macros per portion are estimates (assumed). Built around the blood test: oats daily, olive oil, fish 2x/week, lean protein.
const MEALS = {
  breakfast: [
    { n:"Overnight oats", d:"80 g oats, 250 g skyr, berries, honey", c:95, p:40, f:7, buy:"oats, skyr, frozen berries, honey" },
    { n:"Protein porridge", d:"80 g oats in milk, banana, 1 scoop whey, 15 g walnuts", c:100, p:40, f:17, buy:"oats, milk 1.5%, bananas, whey, walnuts" },
    { n:"Quark bowl", d:"250 g Magerquark, 60 g oats, apple, cinnamon", c:75, p:40, f:5, buy:"Magerquark, oats, apples" },
    { n:"Arepas con huevo", d:"2 arepas, 1 egg + 2 whites, 50 g avocado, light cheese", c:70, p:30, f:20, buy:"arepa flour (P.A.N.), eggs, avocado, light cheese" },
    { n:"Salmon bagel", d:"2 bagels, smoked salmon, light cream cheese, cucumber", c:80, p:35, f:14, buy:"bagels, smoked salmon, light cream cheese, cucumber" },
    { n:"Eggs on rye", d:"3 slices rye bread, 2 eggs + 100 g cottage cheese, tomato", c:60, p:35, f:18, buy:"rye bread, eggs, cottage cheese, tomatoes" },
  ],
  lunch: [
    { n:"Chicken rice bowl", d:"120 g rice, 180 g chicken, peppers, olive oil", c:100, p:50, f:15, buy:"rice, chicken breast, peppers, olive oil" },
    { n:"Tuna pasta", d:"125 g pasta, 1 can tuna, tomato sauce, spinach, olive oil", c:95, p:45, f:14, buy:"pasta, canned tuna, passata, spinach" },
    { n:"Chili con carne", d:"150 g lean beef, kidney beans, 100 g rice", c:100, p:45, f:15, buy:"lean beef mince (5%), kidney beans, rice, tomatoes" },
    { n:"Couscous chicken salad", d:"100 g couscous, chickpeas, 150 g chicken, feta light", c:90, p:45, f:15, buy:"couscous, chickpeas, chicken, light feta, cucumber" },
    { n:"Potatoes + Kräuterquark", d:"400 g potatoes, 250 g herb quark, 150 g salmon", c:80, p:50, f:20, buy:"potatoes, Kräuterquark, salmon" },
    { n:"Calentado ligero", d:"rice, black beans, 150 g lean beef, 1 egg, plantain", c:110, p:45, f:16, buy:"rice, black beans, lean beef, eggs, plantain" },
  ],
  dinner: [
    { n:"Salmon, potatoes, broccoli", d:"150 g salmon, 350 g potatoes, broccoli", c:70, p:40, f:22, buy:"salmon, potatoes, broccoli", fish:true },
    { n:"Turkey noodle stir-fry", d:"100 g noodles, 180 g turkey, frozen wok veg, soy", c:85, p:45, f:10, buy:"noodles, turkey strips, frozen wok vegetables" },
    { n:"Gnocchi with chicken", d:"400 g gnocchi, 150 g chicken, tomato, parmesan", c:110, p:45, f:12, buy:"gnocchi, chicken, passata, parmesan" },
    { n:"Mackerel + rice", d:"1 can mackerel, 100 g rice, cucumber salad", c:80, p:30, f:20, buy:"canned mackerel, rice, cucumber", fish:true },
    { n:"Lentil dal + skyr", d:"100 g red lentils, rice, spinach, 200 g skyr", c:110, p:45, f:8, buy:"red lentils, rice, spinach, coconut-free curry paste, skyr" },
    { n:"Wraps with beans and chicken", d:"3 whole-wheat wraps, black beans, 150 g chicken, salsa", c:95, p:45, f:12, buy:"wraps, black beans, chicken, salsa" },
  ],
};
const QUICK = [
  { n:"Skyr 500 g", c:20, p:55, f:1 }, { n:"Whey shake", c:3, p:24, f:2 }, { n:"Banana", c:27, p:1, f:0 },
  { n:"Bread + honey", c:30, p:4, f:1 }, { n:"Nuts 30 g", c:5, p:6, f:15 }, { n:"Quark 250 g", c:10, p:30, f:1 },
  { n:"Rice 100 g dry", c:78, p:7, f:1 }, { n:"Gel", c:25, p:0, f:0 },
];
const PANTRY = "Keep at home: oats, skyr or Magerquark, eggs, rice, pasta, canned tuna, canned mackerel, frozen berries, frozen veg, bananas, olive oil, nuts.";
const KG = 78;
const DAYTYPES = { rest:{ label:"Rest day", c:[4,5], f:1.1 }, easy:{ label:"Easy day", c:[5,6], f:1.05 }, quality:{ label:"Hard day", c:[6,7], f:0.95 }, long:{ label:"Long run day", c:[7,8], f:0.95 } };
const isoDay = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let foodLog = LS.get("food", {});           // { "2026-11-08": { meals:{breakfast:{i, eaten}}, extra:[{n,c,p,f}], type } }
let foodDirty = LS.get("foodDirty", []);

async function dayType(ds) {
  const d = foodLog[ds] || {};
  if (d.type) return d.type;
  const wd = new Date(ds + "T12:00").getDay();
  let type = [1,4].includes(wd) ? "quality" : "rest";
  if (settings.key && navigator.onLine) {
    try {
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/events?oldest=${ds}&newest=${ds}`, { headers:{ Authorization:auth() } });
      const ev = (await r.json()).filter((e) => e.category === "WORKOUT").map((e) => e.name || "").join(" ");
      if (/long/i.test(ev)) type = "long"; else if (/threshold|vo2|interval|tempo|test/i.test(ev)) type = "quality"; else if (ev) type = type === "quality" ? "quality" : "easy";
    } catch(e) {}
  }
  return type;
}
function targets(type) { const t = DAYTYPES[type]; return { c:Math.round((t.c[0]+t.c[1])/2*KG), p:Math.round(1.8*KG), f:Math.round(t.f*KG) }; }
function dayOf(ds) {
  if (!foodLog[ds]) {
    const n = Math.floor(new Date(ds + "T12:00").getTime() / 864e5);
    const wd = new Date(ds + "T12:00").getDay();
    const fishDay = wd === 2 || wd === 5;   // fish dinner Tue and Fri
    const nonFish = MEALS.dinner.map((m, i) => (m.fish ? -1 : i)).filter((i) => i >= 0);
    const din = wd === 2 ? 0 : wd === 5 ? 3 : nonFish[n % nonFish.length];
    foodLog[ds] = { meals:{ breakfast:{ i:n % MEALS.breakfast.length, eaten:false }, lunch:{ i:(n * 5 + 2) % MEALS.lunch.length, eaten:false }, dinner:{ i:din, eaten:false } }, extra:[] };
  }
  return foodLog[ds];
}
function totals(d) {
  const t = { c:0, p:0, f:0 };
  Object.entries(d.meals).forEach(([k, m]) => { if (m.eaten) { const x = MEALS[k][m.i]; t.c += x.c; t.p += x.p; t.f += x.f; } });
  d.extra.forEach((x) => { t.c += x.c; t.p += x.p; t.f += x.f; });
  t.kcal = Math.round(t.c * 4 + t.p * 4 + t.f * 9);
  return t;
}
function saveFood(ds) { LS.set("food", foodLog); if (!foodDirty.includes(ds)) foodDirty.push(ds); LS.set("foodDirty", foodDirty); clearTimeout(saveFood.h); saveFood.h = setTimeout(flushFood, 4000); }
async function flushFood() {
  if (!settings.key || !navigator.onLine || !foodDirty.length) return;
  for (const ds of [...foodDirty]) {
    const t = totals(dayOf(ds));
    try {
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness/${ds}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify({ id:ds, carbohydrates:t.c, protein:t.p, fatTotal:t.f, kcalConsumed:t.kcal }) });
      if (!r.ok) throw new Error(r.status);
      foodDirty = foodDirty.filter((x) => x !== ds); LS.set("foodDirty", foodDirty);
    } catch(e) { break; }
  }
}
function streak() {
  let n = 0; const d = new Date();
  if (!isDone(isoDay(d))) d.setDate(d.getDate() - 1);
  while (isDone(isoDay(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function isDone(ds) { const d = foodLog[ds]; return !!d && Object.values(d.meals).every((m) => m.eaten); }

async function food(app) {
  const ds = isoDay(), d = dayOf(ds);
  const type = await dayType(ds); d.type = d.type || type; LS.set("food", foodLog);
  const tg = targets(d.type), tt = totals(d);
  $("#title").textContent = "Food";
  $("#sub").textContent = `${DAYTYPES[d.type].label} · ${tg.c} g carbs, ${tg.p} g protein`;
  app.innerHTML = "";

  const panel = el("div", "card", null, app);
  const top = el("div", "row", null, panel); el("div", "tag", "Today", top);
  const s = streak(); el("span", "streak", s ? `🔥 ${s} day${s > 1 ? "s" : ""} all 3 meals` : "Eat all 3 to start a streak", top);
  const g = el("div", "macros", null, panel); g.style.marginTop = "8px";
  [["Carbs","c"],["Protein","p"],["Fat","f"]].forEach(([n, k]) => {
    const m = el("div", "mac", null, g); el("div", "t", n, m); el("div", "v", `${tt[k]}`, m); el("div", "t", `of ${tg[k]} g`, m);
    const b = el("div", "mbar", null, m); const fill = el("div", tt[k] >= tg[k] * 0.9 ? "full" : "", null, b); fill.style.width = `${Math.min(100, tt[k] / tg[k] * 100)}%`;
  });
  const types = el("div", "quick", null, panel);
  Object.entries(DAYTYPES).forEach(([k, v]) => { const c = el("button", "chip" + (d.type === k ? " on" : ""), v.label.replace(" day", ""), types); c.onclick = () => { d.type = k; saveFood(ds); render(); }; });

  [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"]].forEach(([k, label]) => {
    const m = d.meals[k], x = MEALS[k][m.i];
    const c = el("div", "card meal" + (m.eaten ? " done" : ""), null, app);
    el("div", "when", label + (x.fish ? " · fish day" : ""), c);
    const r = el("div", "row", null, c); el("div", "ex-name", x.n, r); el("span", "badge", `${x.p} g P`, r);
    el("div", "cue", x.d, c);
    el("div", "buy", `🛒 ${x.buy}`, c);
    const a = el("div", "acts", null, c);
    const e = el("button", "eat" + (m.eaten ? " on" : ""), m.eaten ? "✓ Eaten" : "I ate it", a);
    e.onclick = () => { m.eaten = !m.eaten; saveFood(ds); render(); };
    const sw = el("button", "swap", "↻", a); sw.title = "Swap";
    sw.onclick = () => { m.i = (m.i + 1) % MEALS[k].length; m.eaten = false; saveFood(ds); render(); };
  });

  const q = el("div", "card", null, app); el("div", "tag", "Snacks and extras", q);
  const qq = el("div", "quick", null, q);
  QUICK.forEach((x) => { const c = el("button", "chip", `+ ${x.n}`, qq); c.onclick = () => { d.extra.push(x); saveFood(ds); toast(`${x.n} added`); render(); }; });
  if (d.extra.length) {
    const l = el("div", "hist", null, q); l.style.marginTop = "10px";
    d.extra.forEach((x, i) => { const r = el("div", "row", null, l); el("span", null, x.n, r); const b = el("button", "chip", "✕", r); b.onclick = () => { d.extra.splice(i, 1); saveFood(ds); render(); }; });
  }
  const left = { c:tg.c - tt.c, p:tg.p - tt.p };
  if (left.p > 20 || left.c > 60) el("div", "cue", `Still to go: ${Math.max(0,left.c)} g carbs, ${Math.max(0,left.p)} g protein. ${left.p > 30 ? "Easiest: skyr or a shake." : ""} ${left.c > 100 ? "Add rice, bread or a banana." : ""}`, q);
  el("div", "cue", PANTRY, app);
}

// ---------- upload ----------
const auth = () => "Basic " + btoa("API_KEY:" + settings.key);
const ABBR = { tbdl:"Trap-bar DL", bss:"Bulgarian SS", hpc:"Hang power clean", splank:"Side plank", calf:"SL calf raise" };
function describe(s) {
  const lines = PROGRAM.filter((p) => s.ex[p.id].done > 0).map((p) => { const r = s.ex[p.id]; return p.unit === "s" ? `${ABBR[p.id]}: ${r.done}x${r.load}s/side${r.rpe ? ` RPE ${r.rpe}` : ""}` : `${ABBR[p.id]}: ${r.done}x${p.reps} @ ${r.load} kg${r.rpe ? ` RPE ${r.rpe}` : ""}`; });
  const data = { v:1, mob:s.mob.length, ex:Object.fromEntries(PROGRAM.map((p) => [p.id, { load:s.ex[p.id].load, sets:s.ex[p.id].done, of:p.sets, reps:p.reps, unit:p.unit, rpe:s.ex[p.id].rpe }])) };
  return `${lines.join("\n")}\nMobility ${s.mob.length}/${MOBILITY.length}\n\ngym:${JSON.stringify(data)}`;
}
async function upload(s) {
  const rpes = PROGRAM.map((p) => s.ex[p.id].rpe).filter(Boolean);
  const local = new Date(s.start); const pad = (n) => String(n).padStart(2, "0");
  const body = {
    start_date_local:`${local.getFullYear()}-${pad(local.getMonth()+1)}-${pad(local.getDate())}T${pad(local.getHours())}:${pad(local.getMinutes())}:00`,
    type:"WeightTraining", name:"Gym: strength", description:describe(s),
    moving_time:s.sec, elapsed_time:s.sec, external_id:s.id,
    icu_rpe: rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0) / rpes.length) : undefined,
  };
  const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/activities/manual`, { method:"POST", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(String(r.status));
}
async function flush() {
  if (!settings.key || !queue.length || !navigator.onLine) return;
  for (const s of [...queue]) {
    try { await upload(s); queue = queue.filter((q) => q.id !== s.id); const h = history.find((x) => x.id === s.id); if (h) h.uploaded = true; LS.set("queue", queue); LS.set("history", history); toast("Uploaded to Intervals.icu"); }
    catch(e) { toast(`Upload failed (${e.message}). It stays queued.`); break; }
  }
  render();
}
$("#finish").onclick = () => {
  const missingRpe = PROGRAM.filter((p) => cur.ex[p.id].done >= p.sets && !cur.ex[p.id].rpe);
  if (missingRpe.length && !confirm(`No RPE for ${missingRpe.map((p)=>p.name).join(", ")}. Progression needs it. Finish anyway?`)) return;
  cur.sec = Math.max(600, Math.round((Date.now() - new Date(cur.start)) / 1000));
  history.push(cur); queue.push(cur); LS.set("history", history); LS.set("queue", queue);
  cur = null; LS.set("current", null); clearInterval(tInt); $("#timer").classList.remove("show");
  toast(settings.key ? "Saved. Uploading…" : "Saved. Add your API key in Settings to upload.");
  flush(); render();
};
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
window.addEventListener("online", () => { flush(); flushFood(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); flush(); flushFood();
</script>
