<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Flexoki. Night (default): black, base-950/900/850, tx base-200/500, 400 accents. Day: paper, base-50/100/150, tx black/base-600, 600 accents. */
:root { --bg:#100F0F; --card:#1C1B1A; --ui:#282726; --line:#343331; --text:#CECDC3; --muted:#878580; --on:#100F0F; --accent:#4385BE; --good:#879A39; --warn:#D0A215; --red:#D14D41; --orange:#DA702C;
  --good-bg:rgba(135,154,57,.2); --warn-bg:rgba(208,162,21,.2); --red-bg:rgba(209,77,65,.2); --r:16px; color-scheme:dark; }
html.day { --bg:#FFFCF0; --card:#F2F0E5; --ui:#E6E4D9; --line:#DAD8CE; --text:#100F0F; --muted:#6F6E69; --on:#FFFCF0; --accent:#205EA6; --good:#66800B; --warn:#AD8301; --red:#AF3029; --orange:#BC5215;
  --good-bg:rgba(102,128,11,.15); --warn-bg:rgba(173,131,1,.15); --red-bg:rgba(175,48,41,.12); color-scheme:light; }
.theme { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:18px; }
.vb { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; } .vb button { height:52px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:650; }
.vb button.on { background:var(--accent); border-color:var(--accent); color:var(--on); } .vb small { display:block; font-size:11px; font-weight:400; color:inherit; opacity:.75; }
.wrow { display:flex; gap:8px; align-items:center; margin-top:10px; } .wrow input { flex:1; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); padding:0 12px; font-size:17px; } .wrow .chip { height:46px; padding:0 16px; }
* { box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body { overflow-x:hidden; margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
body { padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px); max-width:560px; margin:auto; }
h1 { font-size:26px; margin:4px 0 2px; } .muted { color:var(--muted); font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:12px 0; }
.card.done { opacity:.55; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.ex-name { font-weight:650; font-size:17px; } .tag { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.cue { font-size:13px; color:var(--muted); margin:4px 0 10px; }
.sets { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 6px; }
.set { width:52px; height:52px; border-radius:50%; border:2px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; }
.set.on { background:var(--good); border-color:var(--good); color:var(--on); }
.stepper { display:flex; align-items:center; gap:6px; }
.stepper button { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); font-size:20px; }
.stepper input { width:64px; height:40px; text-align:center; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); font-size:17px; font-weight:650; }
.rpe { display:flex; gap:6px; margin-top:10px; align-items:center; } .rpe span { font-size:13px; color:var(--muted); margin-right:2px; }
.chip { min-width:40px; height:36px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; }
.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.macros { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .mac .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; } .mac .t { font-size:12px; color:var(--muted); }
.quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .quick .chip { padding:0 10px; font-size:14px; }
.list { font-size:14px; } .list .it { padding:8px 0; border-bottom:1px solid var(--line); } .list .it:last-child { border-bottom:0; }
.list .it b { font-weight:650; } .list .it div { color:var(--muted); font-size:13px; margin-top:2px; }
.pill { display:inline-block; padding:4px 10px; border-radius:10px; font-size:13px; font-weight:650; }
.pill.good { background:var(--good-bg); color:var(--good); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--red-bg); color:var(--red); }
.mob label { display:flex; gap:10px; align-items:center; padding:8px 0; font-size:15px; }
.mob input { width:22px; height:22px; accent-color:var(--good); }
.bar { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(transparent, var(--bg) 30%); }
.bar .inner { max-width:560px; margin:auto; display:flex; gap:10px; }
.btn { flex:1; height:54px; border-radius:14px; border:0; font-size:17px; font-weight:650; background:var(--accent); color:#fff; }
.btn.ghost { flex:0 0 54px; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:22px; }
.btn:disabled { opacity:.4; }
.timer { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:8px 16px; border-radius:20px; font-weight:700; font-variant-numeric:tabular-nums; display:none; z-index:5; }
.timer.show { display:block; } .timer.over { background:var(--good); color:var(--on); }
.field { display:block; margin:10px 0; } .field input { width:100%; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); padding:0 12px; font-size:16px; }
.hist { font-size:14px; } .hist .row { padding:6px 0; border-bottom:1px solid var(--line); }
.badge { flex:none; white-space:nowrap; font-size:12px; padding:2px 8px; border-radius:10px; background:var(--ui); color:var(--muted); }
.badge.up { background:var(--good-bg); color:var(--good); }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ui); border:1px solid var(--line); padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:90%; text-align:center; }
.toast.show { display:block; }
nav { display:flex; gap:8px; margin:8px 0 4px; } nav button { flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:14px; }
nav button.on { background:var(--card); color:var(--text); }
svg.spark { width:100%; height:40px; }
</style>
</head>
<body>
<div id="timer" class="timer"></div>
<div id="toast" class="toast"></div>
<header>
  <div class="row"><h1 id="title">Gym</h1><div class="row"><span id="sync" class="badge"></span><button id="theme" class="theme" aria-label="Night mode"></button></div></div>
  <div id="sub" class="muted"></div>
  <nav><button data-tab="food">Fuel</button><button data-tab="recovery">Recover</button><button data-tab="today" class="on">Gym</button><button data-tab="history">Progress</button><button data-tab="settings">⚙</button></nav>
</header>
<main id="app"></main>
<div class="bar" id="bar"><div class="inner"><button class="btn" id="finish">Finish and upload</button></div></div>

<script>
// ---------- program ----------
const PROGRAM = [
  { id:"tbdl", name:"Trap-bar deadlift", tag:"Max strength", sets:4, reps:5, unit:"kg", step:2.5, inc:5, rest:180, cue:"Brace, push the floor away. Every rep crisp, stop 1-2 reps before failure." },
  { id:"bss", name:"Bulgarian split squat", tag:"Max strength · per leg", sets:3, reps:6, unit:"kg", step:1, inc:2, rest:120, cue:"Total dumbbell weight. Knee tracks over the 2nd toe, hips level." },
  { id:"hpc", name:"Hang power clean", tag:"Explosive", sets:5, reps:3, unit:"kg", step:2.5, inc:2.5, rest:120, cue:"Maximal speed. If the bar slows or form breaks, keep the weight." },
  { id:"splank", name:"Side plank + hip abduction", tag:"Isometric · per side", sets:3, reps:1, unit:"s", step:5, inc:5, max:60, rest:60, cue:"Top leg lifted. Straight line ear-hip-ankle. Weight goes on the hip after 60 s." },
  { id:"calf", name:"Single-leg calf raise, bent knee", tag:"Strength + isometric · per leg", sets:3, reps:8, unit:"kg", step:1, inc:2, rest:60, cue:"Knee bent ~30°. 3 s hold at the top. Weight in the hand." },
];
const MOBILITY = ["Hip 90/90, 1 min", "Ankle to wall, 1 min per side", "Thoracic rotation, 10 per side"];

// ---------- storage ----------
const LS = { get:(k,d)=>{ try { const v = localStorage.getItem("gym."+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set:(k,v)=>localStorage.setItem("gym."+k, JSON.stringify(v)) };
let settings = LS.get("settings", { key:"", athlete:"0" });
let history = LS.get("history", []);          // finished sessions
let queue = LS.get("queue", []);              // sessions waiting for upload
let cur = LS.get("current", null);            // session in progress
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt, parent) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined && txt !== null) n.textContent = txt; if (parent) parent.appendChild(n); return n; };
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2600); };

// Next target per exercise from the last session (double progression on RPE).
// Session A (Tuesday, heavy) drives progression. Session B (Saturday, light): one set fewer, about 90% of the A weight.
const setsOf = (p, s = cur) => (s && s.v === "B" ? Math.max(2, p.sets - 1) : p.sets);
function targetFor(ex, v = "A") {
  if (v === "B") { const a = targetFor(ex, "A"); if (a.load === null) return a; const l = ex.unit === "s" ? a.load : Math.round(a.load * 0.9 / ex.step) * ex.step; return { load:l, note: ex.unit === "s" ? "Light: same hold" : "Light: 90% of A", up:false }; }
  const last = [...history].reverse().find((s) => s.v !== "B" && s.ex[ex.id] && s.ex[ex.id].load !== null && s.ex[ex.id].load !== "");
  if (!last) return { load: ex.unit === "s" ? 30 : null, note: ex.unit === "s" ? "Start" : "Test: RPE 6 weight", up:false };
  const r = last.ex[ex.id], all = r.done >= ex.sets, load = Number(r.load);
  if (all && r.rpe && r.rpe <= 7) { const n = ex.max ? Math.min(ex.max, load + ex.inc) : load + ex.inc; return { load:n, note:`+${n - load} ${ex.unit} (last: RPE ${r.rpe})`, up:n > load }; }
  if (!all) return { load, note:`Same: ${r.done}/${ex.sets} sets last time`, up:false };
  return { load, note:`Same (last: RPE ${r.rpe || "?"})`, up:false };
}
function newSession(v = new Date().getDay() === 6 ? "B" : "A") {
  const ex = {};
  PROGRAM.forEach((p) => { const t = targetFor(p, v); ex[p.id] = { load: t.load, done:0, rpe:null }; });
  return { id:"gym-" + Date.now(), start:new Date().toISOString(), mob:[], ex, v };
}
const save = () => LS.set("current", cur);

// ---------- rest timer ----------
let tEnd = 0, tInt = null;
function startRest(sec) {
  tEnd = Date.now() + sec * 1000; clearInterval(tInt);
  const t = $("#timer"); t.classList.add("show"); t.classList.remove("over");
  const tick = () => {
    const left = Math.round((tEnd - Date.now()) / 1000);
    if (left <= 0) { t.textContent = "Go"; t.classList.add("over"); if (left === 0 && navigator.vibrate) navigator.vibrate([200,100,200]); if (left < -20) { clearInterval(tInt); t.classList.remove("show"); } return; }
    t.textContent = `Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  };
  tick(); tInt = setInterval(tick, 1000);
}
$("#timer").addEventListener("click", () => { clearInterval(tInt); $("#timer").classList.remove("show"); });

// ---------- views ----------
let tab = ["food","recovery","today","history","settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#sync").textContent = queue.length ? `${queue.length} to upload` : (settings.key ? "Intervals ✓" : "No API key");
  $("#bar").style.display = tab === "today" ? "" : "none";
  const app = $("#app"); app.innerHTML = "";
  if (tab === "today") today(app); else if (tab === "food") food(app); else if (tab === "recovery") recovery(app); else if (tab === "history") progress(app); else settingsView(app);
}
function today(app) {
  if (!cur) { cur = newSession(); save(); }
  const doneEx = PROGRAM.filter((p) => cur.ex[p.id].done >= setsOf(p)).length;
  $("#title").textContent = "Today";
  $("#sub").textContent = `${doneEx} of ${PROGRAM.length} exercises · ${history.length} sessions logged`;

  const sw = el("div", "quick", null, app);
  [["A","A · heavy (Tue)"],["B","B · light (Sat)"]].forEach(([v, label]) => {
    const c = el("button", "chip" + ((cur.v || "A") === v ? " on" : ""), label, sw);
    c.onclick = () => { if ((cur.v || "A") === v) return; if (PROGRAM.some((p) => cur.ex[p.id].done > 0)) { toast("Sets already logged. Discard in Settings to switch."); return; } cur = newSession(v); save(); render(); };
  });
  const mob = el("div", "card mob" + (cur.mob.length === MOBILITY.length ? " done" : ""), null, app);
  el("div", "tag", "Mobility · 5 min", mob);
  MOBILITY.forEach((m, i) => {
    const l = el("label", null, null, mob); const c = el("input", null, null, l); c.type = "checkbox"; c.checked = cur.mob.includes(i); el("span", null, m, l);
    c.addEventListener("change", () => { cur.mob = c.checked ? [...cur.mob, i] : cur.mob.filter((x) => x !== i); save(); render(); });
  });

  PROGRAM.forEach((p) => {
    const r = cur.ex[p.id], t = targetFor(p, cur.v);
    const card = el("div", "card" + (r.done >= setsOf(p) && r.rpe ? " done" : ""), null, app);
    el("div", "tag", p.tag, card);
    const top = el("div", "row", null, card);
    el("div", "ex-name", p.name, top);
    el("span", "badge" + (t.up ? " up" : ""), t.note, top);
    el("div", "cue", p.cue, card);
    const row = el("div", "row", null, card);
    el("div", "muted", `${setsOf(p)} × ${p.unit === "s" ? "" : p.reps + " @"}`, row);
    const st = el("div", "stepper", null, row);
    const minus = el("button", null, "−", st), inp = el("input", null, null, st), plus = el("button", null, "+", st);
    inp.inputMode = "decimal"; inp.placeholder = p.unit; inp.value = r.load ?? "";
    el("span", "muted", p.unit, st);
    const setLoad = (v) => { r.load = v === "" || isNaN(v) ? null : Math.max(0, Math.round(v * 10) / 10); save(); inp.value = r.load ?? ""; };
    minus.onclick = () => setLoad((Number(inp.value) || 0) - p.step);
    plus.onclick = () => setLoad((Number(inp.value) || 0) + p.step);
    inp.onchange = () => setLoad(inp.value === "" ? "" : Number(inp.value.replace(",", ".")));
    const sets = el("div", "sets", null, card);
    for (let i = 0; i < setsOf(p); i++) {
      const b = el("button", "set" + (i < r.done ? " on" : ""), p.unit === "s" ? `${r.load || ""}s` : String(p.reps), sets);
      b.onclick = () => {
        if (r.load === null) { toast("Enter the weight first"); inp.focus(); return; }
        const wasOn = i < r.done; r.done = wasOn ? i : i + 1; save(); render();
        if (!wasOn && r.done < setsOf(p)) startRest(p.rest);
      };
    }
    if (r.done >= setsOf(p)) {
      const rp = el("div", "rpe", null, card); el("span", null, "RPE", rp);
      [6,7,8,9,10].forEach((v) => { const c = el("button", "chip" + (r.rpe === v ? " on" : ""), String(v), rp); c.onclick = () => { r.rpe = v; save(); render(); }; });
    }
  });
  $("#finish").disabled = !PROGRAM.some((p) => cur.ex[p.id].done > 0);
}
function progress(app) {
  $("#title").textContent = "Progress";
  $("#sub").textContent = `${history.length} sessions`;
  if (!history.length) { el("div", "card muted", "Your first session sets the starting weights. Progress shows here after it.", app); return; }
  PROGRAM.forEach((p) => {
    const pts = history.filter((s) => s.ex[p.id] && s.ex[p.id].load).map((s) => ({ d:s.start, v:Number(s.ex[p.id].load), rpe:s.ex[p.id].rpe }));
    const c = el("div", "card", null, app);
    const top = el("div", "row", null, c); el("div", "ex-name", p.name, top);
    el("span", "badge", pts.length ? `${pts[pts.length-1].v} ${p.unit}${pts.length > 1 ? ` · ${pts[pts.length-1].v - pts[0].v >= 0 ? "+" : ""}${Math.round((pts[pts.length-1].v - pts[0].v)*10)/10}` : ""}` : "–", top);
    if (pts.length > 1) {
      const lo = Math.min(...pts.map((x) => x.v)), hi = Math.max(...pts.map((x) => x.v)), W = 300, H = 40;
      const sx = (i) => 4 + (i / (pts.length - 1)) * (W - 8), sy = (v) => hi === lo ? H/2 : H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
      c.insertAdjacentHTML("beforeend", `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${pts.map((x,i)=>`${i?"L":"M"}${sx(i)},${sy(x.v)}`).join(" ")}" fill="none" style="stroke:var(--orange)" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
    }
  });
  const h = el("div", "card hist", null, app); el("div", "tag", "Sessions", h);
  [...history].reverse().slice(0, 12).forEach((s) => {
    const r = el("div", "row", null, h);
    el("span", null, new Date(s.start).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }), r);
    el("span", "badge" + (s.uploaded ? " up" : ""), s.uploaded ? "in Intervals" : "waiting", r);
  });
}
function settingsView(app) {
  $("#title").textContent = "Settings"; $("#sub").textContent = "Stored only on this phone.";
  const c = el("div", "card", null, app);
  const f1 = el("label", "field", null, c); el("div", "muted", "Intervals.icu API key (Settings → Developer)", f1);
  const k = el("input", null, null, f1); k.type = "password"; k.value = settings.key; k.autocomplete = "off";
  const f2 = el("label", "field", null, c); el("div", "muted", "Athlete id (0 = you)", f2);
  const a = el("input", null, null, f2); a.value = settings.athlete;
  const b = el("button", "btn", "Save and test", c); b.style.width = "100%";
  b.onclick = async () => {
    settings = { key:k.value.trim(), athlete:a.value.trim() || "0" }; LS.set("settings", settings);
    try { const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}`, { headers:{ Authorization:auth() } }); toast(r.ok ? "Connected to Intervals.icu" : `Failed (${r.status}). Check the key.`); } catch(e) { toast("No connection. Saved anyway."); }
    flush(); render();
  };
  const d = el("div", "card", null, app); el("div", "tag", "Data", d);
  const ex = el("button", "chip", "Export backup", d); ex.style.marginTop = "8px";
  ex.onclick = () => { const blob = new Blob([JSON.stringify({ history }, null, 1)], { type:"application/json" }); const u = URL.createObjectURL(blob); const l = el("a"); l.href = u; l.download = "gym-backup.json"; l.click(); };
  const rs = el("button", "chip", "Discard today's session", d); rs.style.margin = "8px 0 0 8px";
  rs.onclick = () => { if (confirm("Discard the session in progress?")) { cur = null; LS.set("current", null); tab = "today"; render(); } };
}

// ---------- fuel: macro and micro targets for the day (no meal suggestions, athlete 2026-11-10) ----------
// Mirrors 03 ToDo/Nutrition/nutrition_plan.json (change both). Grams are derived from g/kg guidelines.
let weights = LS.get("weights", []);       // [{ d:"2026-11-11", kg:78.2 }] from the app and Intervals.icu wellness
let KG = weights.length ? weights[weights.length - 1].kg : 78;
const DAYTYPES = {
  rest:{ label:"Rest day", c:[4,5], f:[1.0,1.2], note:"Carbs from whole foods. Protein stays high for repair. Saturated fat under about 30 g." },
  easy:{ label:"Easy day", c:[5,6], f:[1.0,1.1], note:"Normal meals. 20-40 g protein within 2 h after training. Oats at breakfast." },
  volleyball:{ label:"Volleyball day", c:[5,6], f:[1.0,1.1], note:"About 600 kcal of real work, not the 1,000 the watch shows (pauses counted). Snack 18:30, after 22:00 carbs + 30 g protein, then sleep." },
  quality:{ label:"Hard run day", c:[6,7], f:[0.9,1.0], note:"Carb snack 1-2 h before. Carbs + 30 g protein within 2 h after." },
  long:{ label:"Long run day", c:[7,8], f:[0.9,1.0], note:"Carb-rich dinner the night before. Over 75 min: 30-60 g carbs per hour. Within 1 h after: 1 g/kg carbs + 30 g protein." },
};
const MICROS = [
  ["Iron", "Lentils, beans, tofu, oats, pumpkin seeds, with vitamin C. No coffee or tea within 1 h. Ferritin not tested yet"],
  ["Oats, soluble fibre", "70-80 g oats a day (3 g beta-glucan), beans, barley, apples. Lowers LDL"],
  ["Good fats", "Olive or rapeseed oil, 30 g nuts. Saturated fat under 10% of energy (LDL 118)"],
  ["Omega-3", "Walnuts, ground flax, chia daily + algae oil 250-500 mg EPA+DHA"],
  ["Calcium", "2-3 servings: skyr, Magerquark, milk or fortified drinks"],
  ["Vitamin D", "D3 1000-2000 IU Oct-Mar with a fatty meal, eggs"],
  ["Magnesium", "Nuts, seeds, oats, legumes; 200-300 mg glycinate before bed"],
  ["B12, folate", "Eggs and dairy daily, leafy greens. Test B12 (vegetarian)"],
  ["Potassium, sodium", "Bananas, potatoes; salt on sweaty days"],
  ["Fibre, polyphenols", "5 colours a day, 30-40 g fibre"],
  ["Creatine", "3-5 g daily, any time"],
];
const isoDay = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let foodLog = LS.get("food", {});           // only the day-type override: { "2026-11-10": { type } }

async function dayType(ds) {
  const d = foodLog[ds] || {};
  if (d.type && DAYTYPES[d.type]) return d.type;
  const wd = new Date(ds + "T12:00").getDay();
  let type = [1,4].includes(wd) ? "volleyball" : "rest";
  if (settings.key && navigator.onLine) {
    try {
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/events?oldest=${ds}&newest=${ds}`, { headers:{ Authorization:auth() } });
      const ev = (await r.json()).filter((e) => e.category === "WORKOUT").map((e) => e.name || "").join(" ");
      if (/long/i.test(ev)) type = "long"; else if (/threshold|vo2|interval|tempo|test/i.test(ev)) type = "quality"; else if (ev && type === "rest") type = "easy";
    } catch(e) {}
  }
  return type;
}
function targets(type) {
  const t = DAYTYPES[type], g = (r) => [Math.round(r[0]*KG), Math.round(r[1]*KG)];
  const c = g(t.c), p = g([1.6,2.0]), f = g(t.f);
  return { c, p, f, kcal:[c[0]*4+p[0]*4+f[0]*9, c[1]*4+p[1]*4+f[1]*9].map((x) => Math.round(x/50)*50), sat:Math.round((c[0]*4+p[0]*4+f[0]*9) * 0.1 / 9) };
}

// ---------- weekly weight: saved to Intervals.icu wellness (weight), read back by the vault's weekly review ----------
async function loadWeights() {
  if (!settings.key || !navigator.onLine) return;
  try {
    const old = new Date(); old.setDate(old.getDate() - 60);
    const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness?oldest=${isoDay(old)}&newest=${isoDay()}`, { headers:{ Authorization:auth() } });
    const w = (await r.json()).filter((x) => x.weight).map((x) => ({ d:x.id, kg:Math.round(x.weight * 10) / 10 }));
    const local = weights.filter((x) => x.pending);
    weights = [...w.filter((x) => !local.some((l) => l.d === x.d)), ...local].sort((a, b) => a.d < b.d ? -1 : 1);
    LS.set("weights", weights); if (weights.length) KG = weights[weights.length - 1].kg;
  } catch(e) {}
}
async function pushWeights() {
  if (!settings.key || !navigator.onLine) return;
  for (const x of weights.filter((w) => w.pending)) {
    try {
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness/${x.d}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify({ id:x.d, weight:x.kg }) });
      if (!r.ok) throw new Error(r.status); delete x.pending; LS.set("weights", weights);
    } catch(e) { break; }
  }
}
function weightCard(app, ds) {
  const c = el("div", "card", null, app);
  const top = el("div", "row", null, c); el("div", "tag", "Weekly weight", top);
  const last = weights[weights.length - 1];
  const days = last ? Math.round((new Date(ds + "T12:00") - new Date(last.d + "T12:00")) / 864e5) : null;
  el("span", "badge" + (days === null || days >= 7 ? "" : " up"), days === null ? "No weigh-in yet" : days >= 7 ? "Weigh-in due" : `${last.kg} kg · ${days ? days + " d ago" : "today"}`, top);
  const ago14 = new Date(ds + "T12:00"); ago14.setDate(ago14.getDate() - 14);
  const ref = [...weights].reverse().find((w) => w.d <= isoDay(ago14)) || weights[0];
  if (last && ref && ref !== last) {
    const ch = Math.round((last.kg - ref.kg) * 10) / 10;
    const p = el("div", null, null, c); p.style.marginTop = "10px";
    el("span", "pill " + (ch < -1 ? "bad" : Math.abs(ch) > 0.6 ? "warn" : "good"), `${ch >= 0 ? "+" : ""}${ch} kg since ${ref.d.slice(5)}`, p);
    if (ch < -1) el("div", "cue", "More than 1 kg down in 2 weeks: eat more carbs before adding training. Under-fuelling shows here first.", c);
  }
  if (weights.length > 1) {
    const pts = weights.slice(-10), lo = Math.min(...pts.map((x) => x.kg)) - 0.3, hi = Math.max(...pts.map((x) => x.kg)) + 0.3, W = 300, H = 40;
    const sx = (i) => 4 + (i / Math.max(1, pts.length - 1)) * (W - 8), sy = (v) => H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
    c.insertAdjacentHTML("beforeend", `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${pts.map((x,i)=>`${i?"L":"M"}${sx(i)},${sy(x.kg)}`).join(" ")}" fill="none" style="stroke:var(--orange)" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
  }
  const row = el("div", "wrow", null, c);
  const inp = el("input", null, null, row); inp.inputMode = "decimal"; inp.placeholder = "kg, morning, before breakfast";
  const b = el("button", "chip", "Save", row);
  b.onclick = async () => {
    const kg = Number(inp.value.replace(",", "."));
    if (!(kg > 40 && kg < 150)) { toast("Enter your weight in kg"); return; }
    weights = weights.filter((w) => w.d !== ds); weights.push({ d:ds, kg:Math.round(kg * 10) / 10, pending:true }); LS.set("weights", weights); KG = Math.round(kg * 10) / 10;
    await pushWeights(); toast(weights.some((w) => w.pending) ? "Saved. Uploads when online." : "Saved to Intervals.icu"); render();
  };
  el("div", "cue", "Once a week, same morning, after the toilet, before breakfast. Targets follow your latest weight.", c);
}

async function food(app) {
  if (!food.loaded) { food.loaded = true; await pushWeights(); await loadWeights(); }
  const ds = isoDay(); const type = await dayType(ds); const tg = targets(type), t = DAYTYPES[type];
  if (tab !== "food") return;
  $("#title").textContent = "Fuel";
  $("#sub").textContent = `${t.label} · targets for ${KG} kg (derived)`;
  app.innerHTML = "";

  const panel = el("div", "card", null, app); el("div", "tag", "Macros today", panel);
  const g = el("div", "macros", null, panel); g.style.marginTop = "8px";
  [["Carbs", tg.c], ["Protein", tg.p], ["Fat", tg.f], ["kcal", tg.kcal]].forEach(([n, r]) => {
    const m = el("div", "mac", null, g); el("div", "t", n, m); el("div", "v", `${r[0]}`, m); el("div", "t", `to ${r[1]}${n === "kcal" ? "" : " g"}`, m);
  });
  el("div", "cue", `Protein in 4-5 doses of 30-40 g. Saturated fat under ${tg.sat} g. kcal is a guide, not a number to count.`, panel);
  el("div", "cue", t.note, panel);
  const types = el("div", "quick", null, panel);
  Object.entries(DAYTYPES).forEach(([k, v]) => { const c = el("button", "chip" + (type === k ? " on" : ""), v.label.replace(" day", ""), types); c.onclick = () => { foodLog[ds] = { type:k }; LS.set("food", foodLog); render(); }; });

  weightCard(app, ds);

  const mc = el("div", "card list", null, app); el("div", "tag", "Micros to keep in mind", mc);
  MICROS.forEach(([n, d]) => { const it = el("div", "it", null, mc); el("b", null, n, it); el("div", null, d, it); });
}

// ---------- recovery: last night from Intervals.icu wellness + tips for the day ----------
const REC_DAY = {
  rest:["Rest means rest: walk 20-30 min, 10 min mobility, nothing hard.", "Use the day to bank sleep: 30-60 min earlier to bed.", "Keep protein high: 4-5 doses even without training."],
  easy:["Keep it truly easy: HR in Zone 1-2. Easy days make hard days possible.", "10 min hip and glute work after (side plank, clams): the ITBS knee likes it.", "Gym day: skip ice baths for 4-6 h after. Cold water blunts strength gains."],
  volleyball:["18:30 snack: bread, banana or rice cakes. Water bottle to training.", "10 min hip activation before. Land on two feet, knee over the 2nd toe.", "After 22:00: carbs + 30 g protein, warm shower, dim lights, no screens 30 min.", "Late heart rate keeps you awake: aim for lights out by 23:30 and 8 h in bed.", "Next morning: if HRV is low, make the run easy."],
  quality:["Cool down 10 min easy, then carbs + 30 g protein within 2 h.", "Legs up or easy walk in the evening, no second hard session.", "If you sleep badly tonight, tomorrow stays easy."],
  long:["Weigh before and after: drink 1-1.5 L per kg lost, with salt.", "Within 1 h: about 80 g carbs + 30 g protein.", "A 20-30 min nap before 15:00 helps. Evening: 15 min walk, mobility.", "Next day easy or rest. Knee check the next morning."],
};
const REC_TIPS = [
  "Sleep is the strongest recovery tool: 8-9 h in bed. Extra sleep made athletes faster and more accurate in studies.",
  "Same wake-up time every day, also weekends. 10 min of daylight in the morning sets the clock.",
  "No caffeine after 14:00. Caffeine stays in the body 5-6 h.",
  "Alcohol lowers HRV and deep sleep for 1-2 nights, even in small amounts.",
  "Bedroom cool (17-19 °C) and dark. A warm shower 1-2 h before bed helps you fall asleep.",
  "30-40 g casein (Magerquark) before bed supports overnight repair.",
  "Foam rolling lowers soreness a little but doesn't fix the IT band. Strong glutes do.",
  "Under-eating looks like over-training: falling HRV, weight and mood. Eat more first.",
  "Hard days hard, easy days easy. Most poor recovery is grey-zone running.",
  "Heavy week? Tart cherry juice or more fruit and veg can ease soreness. Food first.",
  "Stress counts as load. On a stressful work day, a hard session can wait.",
  "Compression socks after long runs: small effect on soreness, harmless.",
];
let recChecks = LS.get("recChecks", {});
const HABITS = ["8 h in bed", "Protein 4+ doses", "10 min mobility", "No caffeine after 14:00", "No screens 30 min before bed"];

// ---------- volleyball category: easy / normal / hard ----------
// Writes vb:<category> and RPE to the session in Intervals.icu. The vault (analyze.ps1) reads the tag and takes
// the watch data above Zone 1. Without a watch recording it also sets the template load. Templates: coach_rules.json.
const VB = {
  easy:{ label:"Easy", sub:"like Mon 9 Nov", rpe:4, load:89 },
  normal:{ label:"Normal", sub:"usual training", rpe:6, load:115 },
  hard:{ label:"Hard", sub:"match pace, many jumps", rpe:8, load:145 },
};
let vbRated = LS.get("vbRated", {});       // { "2026-11-09": { cat:"easy", sent:true } }
function vbDay() {
  const now = new Date();
  for (let i = 0; i <= 2; i++) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    if ([1,4].includes(d.getDay())) { if (i === 0 && now.getHours() < 21) continue; return isoDay(d); }
  }
  return null;
}
async function sendVb() {
  let n = 0;
  if (!settings.key || !navigator.onLine) return n;
  for (const [ds, r0] of Object.entries(vbRated)) {
    if (r0.sent) continue;
    try {
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/activities?oldest=${ds}&newest=${ds}`, { headers:{ Authorization:auth() } });
      const a = (await r.json()).find((x) => /volley/i.test(x.name || "") || /volley/i.test(x.type || ""));
      if (!a) continue;                       // not synced yet: stays pending
      const v = VB[r0.cat];
      const desc = `${(a.description || "").replace(/\n?vb:(easy|normal|hard)\b/g, "").trim()}\nvb:${r0.cat}`.trim();
      const body = { icu_rpe:v.rpe, description:desc };
      if (!a.average_heartrate) body.icu_training_load = v.load;
      const p = await fetch(`https://intervals.icu/api/v1/activity/${a.id}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
      if (!p.ok) throw new Error(p.status);
      r0.sent = true; LS.set("vbRated", vbRated); n++;
    } catch(e) { break; }
  }
  return n;
}
function vbCard(app) {
  const ds = vbDay(); if (!ds) return;
  const c = el("div", "card", null, app);
  const top = el("div", "row", null, c);
  el("div", "tag", `Volleyball · ${new Date(ds + "T12:00").toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" })}`, top);
  const cur = vbRated[ds];
  el("span", "badge" + (cur && cur.sent ? " up" : ""), cur ? (cur.sent ? "In Intervals" : "Waiting for the session") : "How was it?", top);
  const g = el("div", "vb", null, c);
  Object.entries(VB).forEach(([k, v]) => {
    const b = el("button", cur && cur.cat === k ? "on" : "", v.label, g); el("small", null, v.sub, b);
    b.onclick = async () => { vbRated[ds] = { cat:k, sent:false }; LS.set("vbRated", vbRated); render(); await sendVb(); toast(vbRated[ds].sent ? `${v.label} saved to Intervals.icu` : "Saved. Sent when the session is in Intervals.icu."); render(); };
  });
  el("div", "cue", "Only time above Zone 1 counts as work, so pauses don't inflate calories. Without the watch, the category sets the load.", c);
}

async function recovery(app) {
  if (!recovery.sent) { recovery.sent = true; sendVb().then((n) => { if (n && tab === "recovery") render(); }); }
  const my = recovery.tok = (recovery.tok || 0) + 1;
  const ds = isoDay(); const type = await dayType(ds);
  if (tab !== "recovery" || my !== recovery.tok) return;
  $("#title").textContent = "Recover"; $("#sub").textContent = `${DAYTYPES[type].label} · last night from Intervals.icu`;
  app.innerHTML = "";

  const night = el("div", "card", null, app); el("div", "tag", "Last night", night);
  const body = el("div", null, null, night);
  if (!settings.key || !navigator.onLine) el("div", "cue", settings.key ? "Offline. Tips below still apply." : "Add your API key in Settings to see sleep and HRV.", body);
  else {
    try {
      const old = new Date(); old.setDate(old.getDate() - 28);
      const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness?oldest=${isoDay(old)}&newest=${ds}`, { headers:{ Authorization:auth() } });
      const w = (await r.json()).sort((a, b) => a.id < b.id ? -1 : 1);
      if (my !== recovery.tok) return;
      const today = w.find((x) => x.id === ds && (x.hrv || x.sleepSecs || x.restingHR)) || w.filter((x) => x.hrv || x.sleepSecs).pop() || {};
      const base = w.filter((x) => x.id !== today.id);
      const stat = (k) => { const v = base.map((x) => x[k]).filter((x) => x); if (v.length < 5) return null; const m = v.reduce((a,b)=>a+b,0)/v.length; return { m, sd:Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length) }; };
      const hs = stat("hrv"), rs = stat("restingHR");
      const sleepH = today.sleepSecs ? today.sleepSecs / 3600 : null;
      let flags = 0, notes = [];
      if (hs && today.hrv && today.hrv < hs.m - hs.sd) { flags++; notes.push("HRV below your usual range"); }
      if (rs && today.restingHR && today.restingHR > rs.m + Math.max(3, rs.sd)) { flags++; notes.push("resting HR up"); }
      if (sleepH !== null && sleepH < 6.5) { flags++; notes.push("short sleep"); }
      const g = el("div", "macros", null, body); g.style.marginTop = "8px";
      [["Sleep", sleepH !== null ? `${sleepH.toFixed(1)} h` : "–", today.sleepScore ? `score ${today.sleepScore}` : ""],
       ["HRV", today.hrv ? Math.round(today.hrv) : "–", hs ? `usual ${Math.round(hs.m)}` : ""],
       ["Rest HR", today.restingHR || "–", rs ? `usual ${Math.round(rs.m)}` : ""],
       ["Form", today.ctl != null && today.atl != null ? Math.round(today.ctl - today.atl) : "–", "CTL − ATL"]].forEach(([n, v, s]) => { const m = el("div", "mac", null, g); el("div", "t", n, m); el("div", "v", String(v), m); el("div", "t", s, m); });
      const p = el("div", null, null, body); p.style.marginTop = "10px";
      const [cls, txt] = flags === 0 ? ["good", "Recovered: train as planned"] : flags === 1 ? ["warn", `Careful: ${notes[0]}. Keep today easy-ish`] : ["bad", `Back off: ${notes.join(", ")}. Easy or rest`];
      el("span", "pill " + cls, txt, p);
      if (today.id && today.id !== ds) el("div", "cue", `Latest data from ${today.id}. Sync the watch for today.`, body);
    } catch(e) { el("div", "cue", "Couldn't load wellness data.", body); }
  }

  vbCard(app);

  const td = el("div", "card list", null, app); el("div", "tag", `Today · ${DAYTYPES[type].label}`, td);
  REC_DAY[type].forEach((x) => el("div", "it", x, td));

  const hb = el("div", "card mob", null, app); el("div", "tag", "Recovery habits today", hb);
  const done = recChecks[ds] || [];
  HABITS.forEach((h, i) => {
    const l = el("label", null, null, hb); const c = el("input", null, null, l); c.type = "checkbox"; c.checked = done.includes(i); el("span", null, h, l);
    c.addEventListener("change", () => { recChecks[ds] = c.checked ? [...done, i] : done.filter((x) => x !== i); Object.keys(recChecks).sort().slice(0, -30).forEach((k) => delete recChecks[k]); LS.set("recChecks", recChecks); render(); });
  });
  let n = 0; const d = new Date(); if ((recChecks[isoDay(d)] || []).length < HABITS.length) d.setDate(d.getDate() - 1);
  while ((recChecks[isoDay(d)] || []).length >= 4) { n++; d.setDate(d.getDate() - 1); }
  el("div", "cue", n ? `${n} day${n > 1 ? "s" : ""} in a row with 4+ habits` : "4 of 5 habits a day starts a streak.", hb);

  const tip = el("div", "card", null, app); el("div", "tag", "Tip of the day", tip);
  el("div", null, REC_TIPS[Math.floor(Date.now() / 864e5) % REC_TIPS.length], tip);
}

// ---------- upload ----------
const auth = () => "Basic " + btoa("API_KEY:" + settings.key);
const ABBR = { tbdl:"Trap-bar DL", bss:"Bulgarian SS", hpc:"Hang power clean", splank:"Side plank", calf:"SL calf raise" };
function describe(s) {
  const lines = PROGRAM.filter((p) => s.ex[p.id].done > 0).map((p) => { const r = s.ex[p.id]; return p.unit === "s" ? `${ABBR[p.id]}: ${r.done}x${r.load}s/side${r.rpe ? ` RPE ${r.rpe}` : ""}` : `${ABBR[p.id]}: ${r.done}x${p.reps} @ ${r.load} kg${r.rpe ? ` RPE ${r.rpe}` : ""}`; });
  const data = { v:1, session:s.v || "A", mob:s.mob.length, ex:Object.fromEntries(PROGRAM.map((p) => [p.id, { load:s.ex[p.id].load, sets:s.ex[p.id].done, of:setsOf(p, s), reps:p.reps, unit:p.unit, rpe:s.ex[p.id].rpe }])) };
  return `${lines.join("\n")}\nMobility ${s.mob.length}/${MOBILITY.length}\n\ngym:${JSON.stringify(data)}`;
}
async function upload(s) {
  const rpes = PROGRAM.map((p) => s.ex[p.id].rpe).filter(Boolean);
  const local = new Date(s.start); const pad = (n) => String(n).padStart(2, "0");
  const body = {
    start_date_local:`${local.getFullYear()}-${pad(local.getMonth()+1)}-${pad(local.getDate())}T${pad(local.getHours())}:${pad(local.getMinutes())}:00`,
    type:"WeightTraining", name:`Gym: strength ${s.v || "A"}`, description:describe(s),
    moving_time:s.sec, elapsed_time:s.sec, external_id:s.id,
    icu_rpe: rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0) / rpes.length) : undefined,
  };
  const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/activities/manual`, { method:"POST", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(String(r.status));
}
async function flush() {
  if (!settings.key || !queue.length || !navigator.onLine) return;
  for (const s of [...queue]) {
    try { await upload(s); queue = queue.filter((q) => q.id !== s.id); const h = history.find((x) => x.id === s.id); if (h) h.uploaded = true; LS.set("queue", queue); LS.set("history", history); toast("Uploaded to Intervals.icu"); }
    catch(e) { toast(`Upload failed (${e.message}). It stays queued.`); break; }
  }
  render();
}
$("#finish").onclick = () => {
  const missingRpe = PROGRAM.filter((p) => cur.ex[p.id].done >= setsOf(p) && !cur.ex[p.id].rpe);
  if (missingRpe.length && !confirm(`No RPE for ${missingRpe.map((p)=>p.name).join(", ")}. Progression needs it. Finish anyway?`)) return;
  cur.sec = Math.max(600, Math.round((Date.now() - new Date(cur.start)) / 1000));
  history.push(cur); queue.push(cur); LS.set("history", history); LS.set("queue", queue);
  cur = null; LS.set("current", null); clearInterval(tInt); $("#timer").classList.remove("show");
  toast(settings.key ? "Saved. Uploading…" : "Saved. Add your API key in Settings to upload.");
  flush(); render();
};
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
// Night mode (Flexoki dark) is the default; the button switches to day (Flexoki light). Saved on the phone.
function applyTheme() {
  const day = LS.get("theme", "night") === "day";
  document.documentElement.classList.toggle("day", day);
  document.querySelector('meta[name="theme-color"]').content = day ? "#FFFCF0" : "#100F0F";
  const b = $("#theme"); b.textContent = day ? "🌙" : "☀"; b.setAttribute("aria-label", day ? "Night mode" : "Day mode");
}
$("#theme").onclick = () => { LS.set("theme", LS.get("theme", "night") === "day" ? "night" : "day"); applyTheme(); };
applyTheme();
window.addEventListener("online", () => { flush(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); flush();
</script>
