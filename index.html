<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Flexoki. Night (default): black, base-950/900/850, tx base-200/500, 400 accents. Day: paper, base-50/100/150, tx black/base-600, 600 accents. */
:root { --bg:#100F0F; --card:#1C1B1A; --ui:#282726; --line:#343331; --text:#CECDC3; --muted:#878580; --on:#100F0F; --accent:#4385BE; --good:#879A39; --warn:#D0A215; --red:#D14D41; --orange:#DA702C;
  --good-bg:rgba(135,154,57,.2); --warn-bg:rgba(208,162,21,.2); --red-bg:rgba(209,77,65,.2); --r:16px; color-scheme:dark; }
html.day { --bg:#FFFCF0; --card:#F2F0E5; --ui:#E6E4D9; --line:#DAD8CE; --text:#100F0F; --muted:#6F6E69; --on:#FFFCF0; --accent:#205EA6; --good:#66800B; --warn:#AD8301; --red:#AF3029; --orange:#BC5215;
  --good-bg:rgba(102,128,11,.15); --warn-bg:rgba(173,131,1,.15); --red-bg:rgba(175,48,41,.12); color-scheme:light; }
.theme { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:18px; }
.vb { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; } .vb button { height:52px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:650; }
.vb button.on { background:var(--accent); border-color:var(--accent); color:var(--on); } .vb small { display:block; font-size:11px; font-weight:400; color:inherit; opacity:.75; }
.wrow { display:flex; gap:8px; align-items:center; margin-top:10px; } .wrow input { flex:1; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); padding:0 12px; font-size:17px; } .wrow .chip { height:46px; padding:0 16px; }
* { box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent; }
html,body { overflow-x:hidden; margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
body { padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px); max-width:560px; margin:auto; }
h1 { font-size:26px; margin:4px 0 2px; } .muted { color:var(--muted); font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:12px 0; }
.card.done { opacity:.55; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.ex-name { font-weight:650; font-size:17px; } .tag { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.cue { font-size:13px; color:var(--muted); margin:4px 0 10px; }
.sets { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 6px; }
.set { width:52px; height:52px; border-radius:50%; border:2px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; }
.set.on { background:var(--good); border-color:var(--good); color:var(--on); }
.stepper { display:flex; align-items:center; gap:6px; }
.stepper button { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); font-size:20px; }
.stepper input { width:64px; height:40px; text-align:center; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); font-size:17px; font-weight:650; }
.rpe { display:flex; gap:6px; margin-top:10px; align-items:center; } .rpe span { font-size:13px; color:var(--muted); margin-right:2px; }
.chip { min-width:40px; height:36px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; }
.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.macros { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .mac .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; } .mac .t { font-size:12px; color:var(--muted); }
.quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .quick .chip { padding:0 10px; font-size:14px; }
.list { font-size:14px; } .list .it { padding:8px 0; border-bottom:1px solid var(--line); } .list .it:last-child { border-bottom:0; }
.list .it b { font-weight:650; } .list .it div { color:var(--muted); font-size:13px; margin-top:2px; }
.pill { display:inline-block; padding:4px 10px; border-radius:10px; font-size:13px; font-weight:650; }
.pill.good { background:var(--good-bg); color:var(--good); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--red-bg); color:var(--red); }
.mob label { display:flex; gap:10px; align-items:center; padding:8px 0; font-size:15px; }
.mob input { width:22px; height:22px; accent-color:var(--good); }
.bar { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(transparent, var(--bg) 30%); }
.bar .inner { max-width:560px; margin:auto; display:flex; gap:10px; }
.btn { flex:1; height:54px; border-radius:14px; border:0; font-size:17px; font-weight:650; background:var(--accent); color:#fff; }
.btn.ghost { flex:0 0 54px; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:22px; }
.btn:disabled { opacity:.4; }
.timer { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:8px 16px; border-radius:20px; font-weight:700; font-variant-numeric:tabular-nums; display:none; z-index:5; }
.timer.show { display:block; } .timer.over { background:var(--good); color:var(--on); }
.field { display:block; margin:10px 0; } .field input { width:100%; height:46px; border-radius:12px; border:1px solid var(--line); background:var(--ui); color:var(--text); padding:0 12px; font-size:16px; }
.hist { font-size:14px; } .hist .row { padding:6px 0; border-bottom:1px solid var(--line); }
.badge { flex:none; white-space:nowrap; font-size:12px; padding:2px 8px; border-radius:10px; background:var(--ui); color:var(--muted); }
.badge.up { background:var(--good-bg); color:var(--good); }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ui); border:1px solid var(--line); padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:90%; text-align:center; }
.toast.show { display:block; }
nav { display:flex; gap:8px; margin:8px 0 4px; } nav button { flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:14px; }
nav button.on { background:var(--card); color:var(--text); }
svg.spark { width:100%; height:40px; }
</style>
</head>
<body>
<div id="timer" class="timer"></div>
<div id="toast" class="toast"></div>
<header>
  <div class="row"><h1 id="title">Gym</h1><div class="row"><span id="sync" class="badge"></span><button id="theme" class="theme" aria-label="Night mode"></button></div></div>
  <div id="sub" class="muted"></div>
  <nav><button data-tab="home" class="on">Today</button><button data-tab="today">Gym</button><button data-tab="food">Fuel</button><button data-tab="history">Progress</button><button data-tab="settings" aria-label="Settings">⚙ Set</button></nav>
</header>
<main id="app"></main>
<div class="bar" id="bar"><div class="inner"><button class="btn" id="finish">Finish and upload</button></div></div>

<script>
// ---------- program ----------
const PROGRAM = [
  { id:"tbdl", name:"Trap-bar deadlift", tag:"Max strength", sets:4, reps:5, unit:"kg", step:2.5, inc:5, rest:180, cue:"Brace, push the floor away. Every rep crisp, stop 1-2 reps before failure." },
  { id:"bss", name:"Bulgarian split squat", tag:"Max strength · per leg", sets:3, reps:6, unit:"kg", step:1, inc:2, rest:120, cue:"Total dumbbell weight. Knee tracks over the 2nd toe, hips level." },
  { id:"hpc", name:"Hang power clean", tag:"Explosive", sets:5, reps:3, unit:"kg", step:2.5, inc:2.5, rest:120, cue:"Maximal speed. If the bar slows or form breaks, keep the weight." },
  { id:"splank", name:"Side plank + hip abduction", tag:"Isometric · per side", sets:3, reps:1, unit:"s", step:5, inc:5, max:60, rest:60, sides:true, cue:"Top leg lifted. Straight line ear-hip-ankle. Log each side: a gap over 10-15% is worth showing the physio." },
  { id:"calf", name:"Single-leg calf raise, bent knee", tag:"Strength + isometric · per leg", sets:3, reps:8, unit:"kg", step:1, inc:2, rest:60, cue:"Knee bent ~30°. 3 s hold at the top. Weight in the hand." },
];
const MOBILITY = ["Hip 90/90, 1 min", "Ankle to wall, 1 min per side", "Thoracic rotation, 10 per side"];

// ---------- storage ----------
const LS = { get:(k,d)=>{ try { const v = localStorage.getItem("gym."+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set:(k,v)=>localStorage.setItem("gym."+k, JSON.stringify(v)) };
let settings = LS.get("settings", { key:"", athlete:"0" });
let history = LS.get("history", []);          // finished sessions
let queue = LS.get("queue", []);              // sessions waiting for upload
let cur = LS.get("current", null);            // session in progress
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt, parent) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined && txt !== null) n.textContent = txt; if (parent) parent.appendChild(n); return n; };
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2600); };

// Next target per exercise from the last session (double progression on RPE).
// Session A (Tuesday, heavy) drives progression. Session B (Saturday, light): one set fewer, about 90% of the A weight.
const setsOf = (p, s = cur) => (s && s.v === "B" ? Math.max(2, p.sets - 1) : p.sets);
function targetFor(ex, v = "A") {
  if (v === "B") { const a = targetFor(ex, "A"); if (a.load === null) return a; const l = ex.unit === "s" ? a.load : Math.round(a.load * 0.9 / ex.step) * ex.step; return { load:l, note: ex.unit === "s" ? "Light: same hold" : "Light: 90% of A", up:false }; }
  const last = [...history].reverse().find((s) => s.v !== "B" && s.ex[ex.id] && s.ex[ex.id].load !== null && s.ex[ex.id].load !== "");
  if (!last) return { load: ex.unit === "s" ? 30 : null, note: ex.unit === "s" ? "Start" : "Test: RPE 6 weight", up:false };
  const r = last.ex[ex.id], all = r.done >= ex.sets, load = Number(r.load);
  if (all && r.rpe && r.rpe <= 7) { const n = ex.max ? Math.min(ex.max, load + ex.inc) : load + ex.inc; return { load:n, note:`+${n - load} ${ex.unit} (last: RPE ${r.rpe})`, up:n > load }; }
  if (!all) return { load, note:`Same: ${r.done}/${ex.sets} sets last time`, up:false };
  return { load, note:`Same (last: RPE ${r.rpe || "?"})`, up:false };
}
function newSession(v = new Date().getDay() === 6 ? "B" : "A") {
  const ex = {};
  PROGRAM.forEach((p) => { const t = targetFor(p, v); ex[p.id] = { load: t.load, done:0, rpe:null }; });
  return { id:"gym-" + Date.now(), start:new Date().toISOString(), mob:[], ex, v };
}
const save = () => LS.set("current", cur);

// ---------- rest timer ----------
let tEnd = 0, tInt = null, actx = null;
// Two short tones when the rest ends (iPhones don't vibrate from the web). The audio context starts on the set tap.
function beep() {
  try {
    if (!actx) return;
    [0, 0.25].forEach((dt) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = 0.2; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + dt); o.stop(actx.currentTime + dt + 0.15); });
  } catch (e) {}
}
function startRest(sec) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
  tEnd = Date.now() + sec * 1000; clearInterval(tInt);
  const t = $("#timer"); t.classList.add("show"); t.classList.remove("over");
  const tick = () => {
    const left = Math.round((tEnd - Date.now()) / 1000);
    if (left <= 0) { t.textContent = "Go"; t.classList.add("over"); if (left === 0) { if (navigator.vibrate) navigator.vibrate([200,100,200]); beep(); } if (left < -20) { clearInterval(tInt); t.classList.remove("show"); } return; }
    t.textContent = `Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  };
  tick(); tInt = setInterval(tick, 1000);
}
$("#timer").addEventListener("click", () => { clearInterval(tInt); $("#timer").classList.remove("show"); });

// ---------- views ----------
let tab = { recovery:"home", gym:"today" }[location.hash.slice(1)] || (["home","food","today","history","settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "home");
function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("#sync").textContent = queue.length ? `${queue.length} to upload` : (settings.key ? "Intervals ✓" : "No API key");
  $("#bar").style.display = tab === "today" ? "" : "none";
  const app = $("#app"); app.innerHTML = "";
  if (tab === "today") today(app); else if (tab === "home") home(app); else if (tab === "food") food(app); else if (tab === "history") progress(app); else settingsView(app);
}
function today(app) {
  if (!cur) { cur = newSession(); save(); }
  const doneEx = PROGRAM.filter((p) => cur.ex[p.id].done >= setsOf(p)).length;
  $("#title").textContent = "Today";
  $("#sub").textContent = `${doneEx} of ${PROGRAM.length} exercises · ${history.length} sessions logged`;

  const sw = el("div", "quick", null, app);
  [["A","A · heavy (Tue)"],["B","B · light (Sat)"]].forEach(([v, label]) => {
    const c = el("button", "chip" + ((cur.v || "A") === v ? " on" : ""), label, sw);
    c.onclick = () => { if ((cur.v || "A") === v) return; if (PROGRAM.some((p) => cur.ex[p.id].done > 0)) { toast("Sets already logged. Discard in Settings to switch."); return; } cur = newSession(v); save(); render(); };
  });
  const mob = el("div", "card mob" + (cur.mob.length === MOBILITY.length ? " done" : ""), null, app);
  el("div", "tag", "Mobility · 5 min", mob);
  MOBILITY.forEach((m, i) => {
    const l = el("label", null, null, mob); const c = el("input", null, null, l); c.type = "checkbox"; c.checked = cur.mob.includes(i); el("span", null, m, l);
    c.addEventListener("change", () => { cur.mob = c.checked ? [...cur.mob, i] : cur.mob.filter((x) => x !== i); save(); render(); });
  });

  PROGRAM.forEach((p) => {
    const r = cur.ex[p.id], t = targetFor(p, cur.v);
    const card = el("div", "card" + (r.done >= setsOf(p) && r.rpe ? " done" : ""), null, app);
    el("div", "tag", p.tag, card);
    const top = el("div", "row", null, card);
    el("div", "ex-name", p.name, top);
    el("span", "badge" + (t.up ? " up" : ""), t.note, top);
    el("div", "cue", p.cue, card);
    // One stepper, or left and right for exercises logged per side (the load is then the weaker side).
    const sides = p.sides ? [["L", "loadL"], ["R", "loadR"]] : [["", "load"]];
    if (p.sides) { if (r.loadL === undefined) r.loadL = r.load; if (r.loadR === undefined) r.loadR = r.load; }
    let inp = null;
    sides.forEach(([lab, key], si) => {
      const row = el("div", "row", null, card); if (si) row.style.marginTop = "6px";
      el("div", "muted", lab ? `${lab === "L" ? "Left" : "Right"} side` : `${setsOf(p)} × ${p.unit === "s" ? "" : p.reps + " @"}`, row);
      const st = el("div", "stepper", null, row);
      const minus = el("button", null, "−", st), box = el("input", null, null, st), plus = el("button", null, "+", st);
      box.inputMode = "decimal"; box.placeholder = p.unit; box.value = r[key] ?? "";
      el("span", "muted", p.unit, st);
      const setLoad = (v) => {
        r[key] = v === "" || isNaN(v) ? null : Math.max(0, Math.round(v * 10) / 10); box.value = r[key] ?? "";
        if (p.sides) r.load = r.loadL != null && r.loadR != null ? Math.min(r.loadL, r.loadR) : (r.loadL ?? r.loadR ?? null);
        save();
      };
      minus.onclick = () => setLoad((Number(box.value) || 0) - p.step);
      plus.onclick = () => setLoad((Number(box.value) || 0) + p.step);
      box.onchange = () => setLoad(box.value === "" ? "" : Number(box.value.replace(",", ".")));
      if (!inp) inp = box;
    });
    const sets = el("div", "sets", null, card);
    for (let i = 0; i < setsOf(p); i++) {
      const b = el("button", "set" + (i < r.done ? " on" : ""), p.unit === "s" ? `${r.load || ""}s` : String(p.reps), sets);
      b.onclick = () => {
        if (r.load === null) { toast("Enter the weight first"); inp.focus(); return; }
        const wasOn = i < r.done; r.done = wasOn ? i : i + 1; save(); render();
        if (!wasOn && r.done < setsOf(p)) startRest(p.rest);
      };
    }
    if (r.done >= setsOf(p)) {
      const rp = el("div", "rpe", null, card); el("span", null, "RPE", rp);
      [6,7,8,9,10].forEach((v) => { const c = el("button", "chip" + (r.rpe === v ? " on" : ""), String(v), rp); c.onclick = () => { r.rpe = v; save(); render(); }; });
    }
  });
  $("#finish").disabled = !PROGRAM.some((p) => cur.ex[p.id].done > 0);
}
function progress(app) {
  $("#title").textContent = "Progress";
  $("#sub").textContent = `${history.length} sessions`;
  // Weeks with 2 sessions (the plan): last 8 weeks and the current streak. Habit feedback, not a score.
  const mon = (d) => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoDay(x); };
  const wk = {}; history.forEach((s) => { const m = mon(s.start); wk[m] = (wk[m] || 0) + 1; });
  const weeks = [...Array(8)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 7 * (7 - i)); return wk[mon(d)] || 0; });
  let streak = 0; for (let i = 6; i >= 0 && weeks[i] >= 2; i--) streak++;
  if (weeks[7] >= 2) streak++;
  const wc = el("div", "card", null, app);
  const wt = el("div", "row", null, wc); el("div", "tag", "Sessions per week · target 2", wt);
  el("span", "badge" + (streak ? " up" : ""), streak ? `${streak} week${streak > 1 ? "s" : ""} in a row` : "Start a streak", wt);
  const wg = el("div", "sets", null, wc);
  weeks.forEach((n, i) => { const b = el("div", "set" + (n >= 2 ? " on" : ""), String(n), wg); b.style.display = "flex"; b.style.alignItems = "center"; b.style.justifyContent = "center"; b.title = i === 7 ? "this week" : `${7 - i} weeks ago`; });
  el("div", "cue", "Last 8 weeks, this week on the right. Hip and calf strength is what protects the ITB knee.", wc);
  if (!history.length) { el("div", "card muted", "Your first session sets the starting weights. Progress shows here after it.", app); return; }
  PROGRAM.forEach((p) => {
    // Estimated 1-rep max (Epley: load x (1 + reps / 30)) makes sessions with different reps comparable.
    const pts = history.filter((s) => s.ex[p.id] && s.ex[p.id].load).map((s) => ({ d:s.start, v: p.unit === "kg" ? Math.round(Number(s.ex[p.id].load) * (1 + p.reps / 30) * 10) / 10 : Number(s.ex[p.id].load), load:Number(s.ex[p.id].load), L:s.ex[p.id].loadL, R:s.ex[p.id].loadR, rpe:s.ex[p.id].rpe }));
    const c = el("div", "card", null, app);
    const top = el("div", "row", null, c); el("div", "ex-name", p.name, top);
    const lastP = pts[pts.length - 1];
    el("span", "badge", pts.length ? `${p.unit === "kg" ? `e1RM ${lastP.v} kg` : `${lastP.v} s`}${pts.length > 1 ? ` · ${lastP.v - pts[0].v >= 0 ? "+" : ""}${Math.round((lastP.v - pts[0].v)*10)/10}` : ""}` : "–", top);
    if (lastP && p.unit === "kg") el("div", "cue", `Last: ${lastP.load} kg × ${p.reps}${p.id === "tbdl" ? ` · e1RM ${Math.round(lastP.v / KG * 100) / 100} × body weight` : ""}`, c);
    if (lastP && p.sides && lastP.L != null && lastP.R != null) { const gap = Math.round(100 * Math.abs(lastP.L - lastP.R) / Math.max(lastP.L, lastP.R, 1)); el("div", "cue", `Left ${lastP.L} s · right ${lastP.R} s${gap ? ` · ${gap}% apart${gap > 15 ? ": show the physio" : ""}` : ""}`, c); }
    if (pts.length > 1) {
      const lo = Math.min(...pts.map((x) => x.v)), hi = Math.max(...pts.map((x) => x.v)), W = 300, H = 40;
      const sx = (i) => 4 + (i / (pts.length - 1)) * (W - 8), sy = (v) => hi === lo ? H/2 : H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
      c.insertAdjacentHTML("beforeend", `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${pts.map((x,i)=>`${i?"L":"M"}${sx(i)},${sy(x.v)}`).join(" ")}" fill="none" style="stroke:var(--orange)" stroke-width="2.5" stroke-linejoin="round"/></svg>`);
    }
  });
  const h = el("div", "card hist", null, app); el("div", "tag", "Sessions", h);
  [...history].reverse().slice(0, 12).forEach((s) => {
    const r = el("div", "row", null, h);
    el("span", null, new Date(s.start).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }), r);
    el("span", "badge" + (s.uploaded ? " up" : ""), s.uploaded ? "in Intervals" : "waiting", r);

// ---------- readiness: the same rules as the vault (coach_rules.json -> readiness, analyze.ps1). Change both. ----------
// HRV on the 7-day mean of ln(HRV) against the 60-day normal range (mean +- 0.5 SD); resting HR, sleep, form, last feel.
const RR = { w:{ hrv:30, rhr:15, sleep:25, load:20, feel:10 }, swc:0.5, hrvPts:40, rhrPts:40, sleepFull:7.5, sleepZero:4.5, tsbFull:-10, tsbZero:-35,
  feel:{ 1:100, 2:100, 3:85, 4:55, 5:25 }, kneeCap:3, kneeScore:30,
  bands:[[75, "good", "Go", "Train as planned."], [55, "warn", "Careful", "Do the session at the slow end of the pace band. If HR runs above the band in the first rep, make it easy."], [0, "bad", "Back off", "Easy 30-40 min or rest. Move quality to another day."]] };
const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const sdev = (a) => { const m = avg(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const addD = (ds, n) => { const d = new Date(ds + "T12:00"); d.setDate(d.getDate() + n); return isoDay(d); };
const bandOf = (score) => RR.bands.find((b) => score >= b[0]);
function readinessFor(ds, well, acts) {
  const by = Object.fromEntries(well.map((w) => [w.id, w])), x = by[ds] || {}, parts = {}, why = [];
  const l7 = [...Array(7)].map((_, i) => by[addD(ds, -i)]).filter((w) => w && w.hrv).map((w) => Math.log(w.hrv));
  const bl = well.filter((w) => w.hrv && w.id < addD(ds, -6) && w.id >= addD(ds, -66)).map((w) => Math.log(w.hrv));
  if (l7.length >= 4 && bl.length >= 14) {
    const m = avg(bl), s = sdev(bl), z = (avg(l7) - m) / s;
    parts.hrv = { score:clamp(100 + Math.min(0, z + RR.swc) * RR.hrvPts, 0, 100), avg7:Math.round(Math.exp(avg(l7))), lo:Math.round(Math.exp(m - RR.swc * s)), hi:Math.round(Math.exp(m + RR.swc * s)) };
    if (z < -RR.swc) why.push(`7-day HRV ${parts.hrv.avg7} is under your range (${parts.hrv.lo}-${parts.hrv.hi})`);
    if (x.hrv && (Math.log(x.hrv) - m) / s < -1.5) why.push("last night's HRV is very low for you");
  }
  const rb = well.filter((w) => w.restingHR && w.id < ds && w.id >= addD(ds, -60)).map((w) => w.restingHR);
  if (x.restingHR && rb.length >= 14) { const z = (x.restingHR - avg(rb)) / sdev(rb); parts.rhr = { score:clamp(100 - Math.max(0, z) * RR.rhrPts, 0, 100), value:x.restingHR, usual:Math.round(avg(rb)) }; if (z > 1) why.push(`resting HR ${x.restingHR} is high for you`); }
  if (x.sleepSecs) { const h = x.sleepSecs / 3600; let sc = clamp(100 * (h - RR.sleepZero) / (RR.sleepFull - RR.sleepZero), 0, 100); if (x.sleepScore) sc = (sc + x.sleepScore) / 2; parts.sleep = { score:sc, h, ss:x.sleepScore }; if (h < 6.5) why.push(`short sleep (${h.toFixed(1)} h)`); }
  const lw = [...well].reverse().find((w) => w.id <= ds && w.ctl != null);
  if (lw) { const tsb = lw.ctl - lw.atl; parts.load = { score:clamp(100 * (tsb - RR.tsbZero) / (RR.tsbFull - RR.tsbZero), 0, 100), tsb:Math.round(tsb) }; if (tsb < -20) why.push(`fatigue is high (form ${Math.round(tsb)})`); }
  const prev = acts.filter((a) => { const d = a.start_date_local.slice(0, 10); return d < ds && d >= addD(ds, -2) && a.feel; }).pop();
  if (prev) { parts.feel = { score:RR.feel[prev.feel] ?? 85 }; if (prev.feel >= 4) why.push("your last session felt poor"); }
  let ws = 0, t = 0; Object.entries(parts).forEach(([k, p]) => { ws += RR.w[k]; t += RR.w[k] * Math.round(p.score); });
  if (ws < 30) return null;
  let score = Math.round(t / ws);
  const knee = acts.filter((a) => a.start_date_local.slice(0, 10) >= addD(ds, -1)).map((a) => ((a.description || "").match(/knee:(\d+)/) || [])[1]).filter(Boolean).map(Number);
  if (knee.length && Math.max(...knee) >= RR.kneeCap) { score = Math.min(score, RR.kneeScore); why.push(`knee pain ${Math.max(...knee)}/10`); }
  return { score, why, parts };
}

let homeData = { day:null, at:0 };
async function loadHome(ds) {
  if (homeData.day === ds && Date.now() - homeData.at < 5 * 60e3) return homeData;
  const h = { headers:{ Authorization:auth() } }, base = `https://intervals.icu/api/v1/athlete/${settings.athlete}`;
  const [well, acts, ev] = await Promise.all([
    fetch(`${base}/wellness?oldest=${addD(ds, -70)}&newest=${ds}`, h).then((r) => r.json()),
    fetch(`${base}/activities?oldest=${addD(ds, -3)}&newest=${ds}`, h).then((r) => r.json()),
    fetch(`${base}/events?oldest=${ds}&newest=${ds}`, h).then((r) => r.json()),
  ]);
  homeData = { day:ds, at:Date.now(), well:well.sort((a, b) => a.id < b.id ? -1 : 1), acts:acts.sort((a, b) => a.start_date_local < b.start_date_local ? -1 : 1), ev };
  return homeData;
}
async function putActivity(a, body) {
  const r = await fetch(`https://intervals.icu/api/v1/activity/${a.id}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
  Object.assign(a, body);
}
const tagged = (desc, key, val) => `${(desc || "").replace(new RegExp(`\\n?${key}:(\\{[^}]*\\}|[\\d.,]+)`, "g"), "").trim()}${val === null ? "" : `\n${key}:${val}`}`.trim();

// Optional knee score: only when something hurt (athlete 2026-11-05: no daily knee input). Written as knee:N on the activity.
function kneeCard(app, H) {
  const a = H.acts.filter((x) => (/Run/.test(x.type) || /volley/i.test(x.name || "")) && x.start_date_local.slice(0, 10) >= addD(isoDay(), -1)).pop();
  if (!a) return;
  const m = (a.description || "").match(/knee:(\d+)/);
  const d = el("details", "card", null, app); if (m) d.open = true;
  el("summary", "tag", m ? `Knee after ${a.name}: ${m[1]}/10` : `Knee hurt after ${a.name}? Only if yes`, d);
  const g = el("div", "quick", null, d);
  [0,1,2,3,4,5,6,7,8].forEach((n) => { const c = el("button", "chip" + (m && Number(m[1]) === n ? " on" : ""), n ? String(n) : "No pain", g); c.onclick = async () => { try { await putActivity(a, { description:tagged(a.description, "knee", n || null) }); toast(n ? `Knee ${n}/10 saved` : "Cleared"); } catch(e) { toast("Not saved. Online?"); } render(); }; });
  el("div", "cue", "3/10 or more makes the vault hold load and caps readiness. Pain that comes back: see the physio.", d);
}

// Long run fuelling and sweat: fuel:{carbs,before,after,fluid,gut} on the run. The vault turns it into g/h and L/h.
function fuelCard(app, H) {
  const a = H.acts.filter((x) => /Run/.test(x.type) && x.moving_time >= 3600 && x.start_date_local.slice(0, 10) >= addD(isoDay(), -2)).pop();
  if (!a) return;
  const m = (a.description || "").match(/fuel:(\{[^}]*\})/); let f = {}; try { if (m) f = JSON.parse(m[1]); } catch(e) {}
  const c = el("div", "card", null, app);
  const top = el("div", "row", null, c); el("div", "tag", `Fuel log · ${a.name}`, top);
  el("span", "badge" + (m ? " up" : ""), m ? `${f.carbs ? Math.round(f.carbs / (a.moving_time / 3600)) : "–"} g/h` : "Not logged", top);
  const fields = [["carbs", "Carbs taken, g (gel ≈ 25)"], ["before", "Weight before, kg"], ["after", "Weight after, kg"], ["fluid", "Drunk during, L"]];
  const inputs = {};
  fields.forEach(([k, lab]) => { const r = el("div", "wrow", null, c); el("span", "muted", lab, r).style.flex = "1.4"; const i = el("input", null, null, r); i.inputMode = "decimal"; i.value = f[k] ?? ""; inputs[k] = i; });
  let gut = f.gut || null; const gg = el("div", "quick", null, c);
  [[1, "Gut fine"], [2, "Some trouble"], [3, "Bad"]].forEach(([v, l]) => { const b = el("button", "chip" + (gut === v ? " on" : ""), l, gg); b.onclick = () => { gut = v; gg.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); }; });
  const sb = el("button", "chip", "Save to the run", c); sb.style.marginTop = "10px";
  sb.onclick = async () => {
    const o = {}; Object.entries(inputs).forEach(([k, i]) => { const v = Number(i.value.replace(",", ".")); if (i.value !== "" && !isNaN(v)) o[k] = v; }); if (gut) o.gut = gut;
    try { await putActivity(a, { description:tagged(a.description, "fuel", JSON.stringify(o)) }); toast("Saved to Intervals.icu"); } catch(e) { toast("Not saved. Online?"); }
    render();
  };
  el("div", "cue", "Hannover: practise 30-60 g carbs per hour from January. Weigh naked, towel-dry. Over 2% body mass lost: drink more.", c);
}

// Weekly jump test: best of 3 countermovement jumps (My Jump app), Monday before volleyball. Saved as cmj:NN in wellness comments.
let jumps = LS.get("jumps", []);
function jumpCard(app, H, ds) {
  const last = jumps[jumps.length - 1];
  const due = new Date().getDay() === 1 || !last || (new Date(ds) - new Date(last.d)) / 864e5 >= 7;
  if (!due && last.d !== ds) return;
  const c = el("div", "card", null, app);
  const top = el("div", "row", null, c); el("div", "tag", "Jump test · best of 3", top);
  const prev = jumps.filter((j) => j.d !== ds).slice(-6).map((j) => j.cm);
  const today = jumps.find((j) => j.d === ds);
  if (today && prev.length >= 3) { const ch = Math.round(1000 * (today.cm - avg(prev)) / avg(prev)) / 10; el("span", "pill " + (ch < -5 ? "bad" : ch < -3 ? "warn" : "good"), `${today.cm} cm · ${ch >= 0 ? "+" : ""}${ch}% vs recent`, top); }
  else el("span", "badge", today ? `${today.cm} cm` : last ? `last ${last.cm} cm` : "First test", top);
  const r = el("div", "wrow", null, c); const i = el("input", null, null, r); i.inputMode = "decimal"; i.placeholder = "cm, from My Jump";
  const b = el("button", "chip", "Save", r);
  b.onclick = async () => {
    const cm = Number(i.value.replace(",", ".")); if (!(cm > 10 && cm < 100)) { toast("Enter the jump height in cm"); return; }
    jumps = jumps.filter((j) => j.d !== ds); jumps.push({ d:ds, cm }); LS.set("jumps", jumps);
    try {
      const w = H.well.find((x) => x.id === ds) || {};
      const comments = `${(w.comments || "").replace(/cmj:\s*[\d.,]+/g, "").trim()} cmj:${cm}`.trim();
      const p = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness/${ds}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify({ id:ds, comments }) });
      if (!p.ok) throw new Error(p.status); w.comments = comments; toast("Saved to Intervals.icu");
    } catch(e) { toast("Saved on the phone. Upload failed."); }
    render();
  };
  el("div", "cue", "Monday before volleyball, same warm-up, hands on hips. More than 5% under your recent average: legs aren't fresh, keep today's run easy.", c);
}

// Personal insights from your own data instead of generic tips.
function insights(H) {
  const out = [], w = H.well.filter((x) => x.id >= addD(isoDay(), -28) && x.sleepSecs);
  const after = w.filter((x) => [2, 5].includes(new Date(x.id + "T12:00").getDay())), other = w.filter((x) => ![2, 5].includes(new Date(x.id + "T12:00").getDay()));
  if (after.length >= 2 && other.length >= 4) {
    const a = avg(after.map((x) => x.sleepSecs / 3600)), o = avg(other.map((x) => x.sleepSecs / 3600));
    out.push(`After volleyball you sleep ${a.toFixed(1)} h against ${o.toFixed(1)} h on other nights (last 4 weeks).${o - a >= 0.5 ? " Eat right after, warm shower, lights out by 23:30." : " Volleyball isn't costing you sleep."}`);
  }
  const wt = H.well.filter((x) => x.weight); if (wt.length >= 2) { const d = wt[wt.length - 1].weight - wt[0].weight; if (Math.abs(d) >= 0.5) out.push(`Weight ${d > 0 ? "up" : "down"} ${Math.abs(d).toFixed(1)} kg in 10 weeks.${d < -1 ? " Eat more carbs before adding training." : ""}`); }
  return out;
}

// Morning check: the three subjective fields Intervals.icu already has (soreness, fatigue, mood), 1-4, 1 = best.
// Saw 2016 (BJSM): subjective wellness tracks training load better than objective markers. Mood: 1 great ... 4 grumpy.
const CHECK = [
  { k:"soreness", q:"Muscles", o:["None","Some","Sore","Very sore"] },
  { k:"fatigue", q:"Fatigue", o:["Fresh","Normal","Tired","Wrecked"] },
  { k:"mood", q:"Mood", o:["Great","Good","Okay","Grumpy"] },
];
function checkCard(app, H, ds) {
  const w = H.well.find((x) => x.id === ds) || (H.well.push({ id:ds }), H.well[H.well.length - 1]);
  const c = el("div", "card", null, app); const top = el("div", "row", null, c); el("div", "tag", "Morning check · 10 seconds", top);
  const done = CHECK.every((f) => w[f.k]);
  el("span", "badge", done ? "Done" : "Do it before you eat", top);
  CHECK.forEach((f) => {
    el("div", "cue", f.q, c);
    const g = el("div", "quick", null, c);
    f.o.forEach((label, i) => {
      const b = el("button", "chip" + (w[f.k] === i + 1 ? " on" : ""), label, g);
      b.onclick = async () => {
        try {
          const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/wellness/${ds}`, { method:"PUT", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify({ id:ds, [f.k]:i + 1 }) });
          if (!r.ok) throw new Error(r.status); w[f.k] = i + 1; toast("Saved to Intervals.icu");
        } catch(e) { toast("Not saved. Online?"); }
        render();
      };
    });
  });
  el("div", "cue", "Two or more answers on the tired side (Sore, Tired, Wrecked, Grumpy) while the score says Go: trust your body, keep today easy.", c);
}

// Rules of the game: what to do and when, in the order it happens.
function rulesCard(app) {
  const d = el("details", "card", null, app); el("summary", "tag", "How it works · rules of the game", d);
  const part = (t, items) => { el("div", "cue", t, d).style.cssText = "margin-top:10px;font-weight:650"; items.forEach((x) => el("div", "it", x, d)); };
  part("Every morning, before breakfast", ["Wear the watch at night so HRV and sleep are there.", "Open Today. Answer the Morning check: muscles, fatigue, mood.", "Read the score and the plan. Go: train as planned. Careful: easy end of the pace band. Back off: easy 30-40 min or rest."]);
  part("After training", ["Volleyball (Mon, Thu): rate it Easy, Normal or Hard. Without a watch it counts as Easy. Tell Claude if you did not go.", "Run: add the knee score only if something hurt. No tap means 0.", "Run of 60 min or more: fill the fuel log (carbs, weight before and after)."]);
  part("Every week", ["Monday before volleyball: jump test, best of 3. Weigh in once in Fuel.", "Tuesday Gym A, Saturday Gym B: open Gym, finish, RPE on each lift. It uploads by itself.", "Sunday: tell Claude \"plan next week\", then sync the vault."]);
  part("Rules that do not bend", ["Knee above 2/10: no extra load next week.", "Never run more than 110% of your longest run of the last 30 days."]);
}

async function home(app) {
  if (!home.sent) { home.sent = true; sendVb().then((n) => { if (n && tab === "home") render(); }); }
  const my = home.tok = (home.tok || 0) + 1;
  const ds = isoDay(); const type = await dayType(ds);
  let H = null; if (settings.key && navigator.onLine) { try { H = await loadHome(ds); } catch(e) { H = null; } }
  if (tab !== "home" || my !== home.tok) return;
  $("#title").textContent = "Today"; $("#sub").textContent = `${new Date().toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"short" })} · ${DAYTYPES[type].label}`;
  app.innerHTML = "";

  if (H) checkCard(app, H, ds);
  // 1. Decision: one score, the same as the vault's (written to Intervals.icu by the vault sync when it ran today).
  const dc = el("div", "card", null, app); el("div", "tag", "Ready to train?", dc);
  if (!H) el("div", "cue", settings.key ? "Offline. The plan and tips below still apply." : "Add your API key in Settings to see readiness.", dc);
  else {
    const r = readinessFor(ds, H.well, H.acts), vault = (H.well.find((x) => x.id === ds) || {}).readiness;
    const score = vault ?? (r && r.score);
    if (score == null) el("div", "cue", "Not enough data for today yet. Sync the watch.", dc);
    else {
      const b = bandOf(score);
      const row = el("div", "row", null, dc); row.style.justifyContent = "flex-start"; row.style.marginTop = "6px";
      el("div", "v", String(score), row).style.cssText = "font-size:34px;font-weight:750;font-variant-numeric:tabular-nums";
      el("span", "pill " + b[1], b[2], row);
      el("div", null, b[3], dc).style.marginTop = "6px";
      el("div", "cue", r && r.why.length ? `Why: ${r.why.join(", ")}.` : "Every signal is in your usual range.", dc);
      if (r) {
        const g = el("div", "macros", null, dc);
        const p = r.parts;
        [["Sleep", p.sleep ? `${p.sleep.h.toFixed(1)} h` : "–", p.sleep && p.sleep.ss ? `score ${p.sleep.ss}` : ""], ["HRV 7 d", p.hrv ? p.hrv.avg7 : "–", p.hrv ? `range ${p.hrv.lo}-${p.hrv.hi}` : ""],
         ["Rest HR", p.rhr ? p.rhr.value : "–", p.rhr ? `usual ${p.rhr.usual}` : ""], ["Form", p.load ? p.load.tsb : "–", "CTL − ATL"]].forEach(([n, v, s]) => { const m = el("div", "mac", null, g); el("div", "t", n, m); el("div", "v", String(v), m); el("div", "t", s, m); });
      }
      el("div", "cue", vault != null ? "Score from the vault sync. Same rules on the phone and in Obsidian." : "Calculated on the phone with the vault's rules (the vault hasn't synced today).", dc);
    }
  }

  // 2. The plan, with one main action.
  const pc = el("div", "card list", null, app); el("div", "tag", "Plan today", pc);
  const wd = new Date().getDay(), items = [];
  (H ? H.ev.filter((e) => e.category === "WORKOUT") : []).forEach((e) => items.push([e.name, ((e.description || "").split("\n\n")[0] || "").slice(0, 160)]));
  if ([1, 4].includes(wd)) items.push(["Volleyball 20-22", "10 min hip activation first. Rate it here afterwards."]);
  const gymV = wd === 2 ? "A" : wd === 6 ? "B" : null;
  if (gymV) items.push([`Gym ${gymV}${gymV === "B" ? " (light)" : ""}`, gymV === "A" ? "Heavy: drives progression. After the run, 6 h apart if you can." : "One set fewer, 90% of A."]);
  if (!items.length) items.push(H ? ["Rest", "Walk 20-30 min, 10 min mobility, bank sleep."] : ["Workouts not loaded", "They come from the Intervals.icu calendar: go online or check the watch."]);
  items.forEach(([n, d]) => { const it = el("div", "it", null, pc); el("b", null, n, it); if (d) el("div", null, d, it); });
  if (gymV) { const b = el("button", "btn", `Start Gym ${gymV}`, pc); b.style.cssText = "width:100%;margin-top:10px"; b.onclick = () => { if (!cur || !PROGRAM.some((p) => cur.ex[p.id].done > 0)) { cur = newSession(gymV); save(); } tab = "today"; render(); }; }

  rulesCard(app);
  vbCard(app);
  if (H) { kneeCard(app, H); fuelCard(app, H); jumpCard(app, H, ds); }

  const td = el("div", "card list", null, app); el("div", "tag", `Today · ${DAYTYPES[type].label}`, td);
  REC_DAY[type].forEach((x) => el("div", "it", x, td));

  const hb = el("div", "card mob", null, app); el("div", "tag", "Recovery habits today", hb);
  const done = recChecks[ds] || [];
  HABITS.forEach((h, i) => {
    const l = el("label", null, null, hb); const c = el("input", null, null, l); c.type = "checkbox"; c.checked = done.includes(i); el("span", null, h, l);
    c.addEventListener("change", () => { recChecks[ds] = c.checked ? [...done, i] : done.filter((x) => x !== i); Object.keys(recChecks).sort().slice(0, -30).forEach((k) => delete recChecks[k]); LS.set("recChecks", recChecks); render(); });
  });
  let n = 0; const d = new Date(); if ((recChecks[isoDay(d)] || []).length < HABITS.length) d.setDate(d.getDate() - 1);
  while ((recChecks[isoDay(d)] || []).length >= 4) { n++; d.setDate(d.getDate() - 1); }
  el("div", "cue", n ? `${n} day${n > 1 ? "s" : ""} in a row with 4+ habits` : "4 of 5 habits a day starts a streak.", hb);

  const own = H ? insights(H) : [];
  const tip = el("div", "card list", null, app); el("div", "tag", own.length ? "From your data" : "Tip of the day", tip);
  (own.length ? own : [REC_TIPS[Math.floor(Date.now() / 864e5) % REC_TIPS.length]]).forEach((x) => el("div", "it", x, tip));
}

// ---------- upload ----------
const auth = () => "Basic " + btoa("API_KEY:" + settings.key);
const ABBR = { tbdl:"Trap-bar DL", bss:"Bulgarian SS", hpc:"Hang power clean", splank:"Side plank", calf:"SL calf raise" };
function describe(s) {
  const lines = PROGRAM.filter((p) => s.ex[p.id].done > 0).map((p) => { const r = s.ex[p.id]; return p.unit === "s" ? `${ABBR[p.id]}: ${r.done}x${p.sides && r.loadL != null ? `${r.loadL}s L / ${r.loadR}s R` : `${r.load}s/side`}${r.rpe ? ` RPE ${r.rpe}` : ""}` : `${ABBR[p.id]}: ${r.done}x${p.reps} @ ${r.load} kg${r.rpe ? ` RPE ${r.rpe}` : ""}`; });
  const data = { v:1, session:s.v || "A", mob:s.mob.length, ex:Object.fromEntries(PROGRAM.map((p) => [p.id, { load:s.ex[p.id].load, sets:s.ex[p.id].done, of:setsOf(p, s), reps:p.reps, unit:p.unit, rpe:s.ex[p.id].rpe, ...(p.sides ? { loadL:s.ex[p.id].loadL ?? null, loadR:s.ex[p.id].loadR ?? null } : {}) }])) };
  return `${lines.join("\n")}\nMobility ${s.mob.length}/${MOBILITY.length}\n\ngym:${JSON.stringify(data)}`;
}
async function upload(s) {
  const rpes = PROGRAM.map((p) => s.ex[p.id].rpe).filter(Boolean);
  const local = new Date(s.start); const pad = (n) => String(n).padStart(2, "0");
  const body = {
    start_date_local:`${local.getFullYear()}-${pad(local.getMonth()+1)}-${pad(local.getDate())}T${pad(local.getHours())}:${pad(local.getMinutes())}:00`,
    type:"WeightTraining", name:`Gym: strength ${s.v || "A"}`, description:describe(s),
    moving_time:s.sec, elapsed_time:s.sec, external_id:s.id,
    icu_rpe: rpes.length ? Math.round(rpes.reduce((a,b)=>a+b,0) / rpes.length) : undefined,
  };
  const r = await fetch(`https://intervals.icu/api/v1/athlete/${settings.athlete}/activities/manual`, { method:"POST", headers:{ Authorization:auth(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(String(r.status));
}
async function flush() {
  if (!settings.key || !queue.length || !navigator.onLine) return;
  for (const s of [...queue]) {
    try { await upload(s); queue = queue.filter((q) => q.id !== s.id); const h = history.find((x) => x.id === s.id); if (h) h.uploaded = true; LS.set("queue", queue); LS.set("history", history); toast("Uploaded to Intervals.icu"); }
    catch(e) { toast(`Upload failed (${e.message}). It stays queued.`); break; }
  }
  render();
}
$("#finish").onclick = () => {
  const missingRpe = PROGRAM.filter((p) => cur.ex[p.id].done >= setsOf(p) && !cur.ex[p.id].rpe);
  if (missingRpe.length && !confirm(`No RPE for ${missingRpe.map((p)=>p.name).join(", ")}. Progression needs it. Finish anyway?`)) return;
  cur.sec = Math.max(600, Math.round((Date.now() - new Date(cur.start)) / 1000));
  history.push(cur); queue.push(cur); LS.set("history", history); LS.set("queue", queue);
  cur = null; LS.set("current", null); clearInterval(tInt); $("#timer").classList.remove("show");
  toast(settings.key ? "Saved. Uploading…" : "Saved. Add your API key in Settings to upload.");
  flush(); render();
};
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
// Night mode (Flexoki dark) is the default; the button switches to day (Flexoki light). Saved on the phone.
function applyTheme() {
  const day = LS.get("theme", "night") === "day";
  document.documentElement.classList.toggle("day", day);
  document.querySelector('meta[name="theme-color"]').content = day ? "#FFFCF0" : "#100F0F";
  const b = $("#theme"); b.textContent = day ? "🌙" : "☀"; b.setAttribute("aria-label", day ? "Night mode" : "Day mode");
}
$("#theme").onclick = () => { LS.set("theme", LS.get("theme", "night") === "day" ? "night" : "day"); applyTheme(); };
applyTheme();
window.addEventListener("online", () => { flush(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); flush();
</script>
